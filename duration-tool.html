.status.err{color:#e57373}

td.title{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{width:100%;min-height:180px;background:#0f0f0f;color:#f0f0f0;border:1px solid #3a3a3c;border-radius:8px;padding:10px;font-family:monospace;font-size:12px;resize:vertical;margin-top:10px}
</style></head>

</script>
<script>
(function(){
var apiKeyInput = document.getElementById('apiKeyInput');
apiKeyInput.value = localStorage.getItem('youtube_api_key_duration_tool') || '';
apiKeyInput.addEventListener('change', function(){
  localStorage.setItem('youtube_api_key_duration_tool', apiKeyInput.value.trim());
});

function parseISO8601Duration(iso){
  var m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  var h = parseInt(m[1]||0,10), min = parseInt(m[2]||0,10), s = parseInt(m[3]||0,10);
  return h*3600+min*60+s;
}
function formatSeconds(total){
  var h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  if(h>0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

var results = []; // {videoId, title, seconds, formatted}

document.getElementById('fetchBtn').addEventListener('click', function(){
  var apiKey = apiKeyInput.value.trim();
  var statusEl = document.getElementById('statusEl');
  if(!apiKey){
    statusEl.textContent = 'Bitte API-Key eingeben.';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = 'Lädt…';
  statusEl.className = 'status';

  var params = new URLSearchParams({part:'contentDetails', id: VIDEO_IDS.join(','), key: apiKey});
  fetch('https://www.googleapis.com/youtube/v3/videos?'+params.toString())
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.error){
        statusEl.textContent = 'API-Fehler: ' + data.error.message;
        statusEl.className = 'status err';
        return;
      }
      if(!data.items || !data.items.length){
        statusEl.textContent = 'Keine Ergebnisse erhalten.';
        statusEl.className = 'status err';
        return;
      }
      results = data.items.map(function(item){
        var seconds = parseISO8601Duration(item.contentDetails.duration);
        return {
          videoId: item.id,
          title: VIDEO_TITLES[item.id] || '(unbekannt)',
          seconds: seconds,
          formatted: formatSeconds(seconds)
        };
      });
      renderResults();
      statusEl.textContent = '✓ ' + results.length + ' von ' + VIDEO_IDS.length + ' Laufzeiten erhalten.';
      statusEl.className = results.length === VIDEO_IDS.length ? 'status ok' : 'status err';
      document.getElementById('resultsCard').style.display = 'block';
      document.getElementById('exportCard').style.display = 'block';
    })
    .catch(function(err){
      statusEl.textContent = 'Netzwerkfehler: ' + (err.message || 'unbekannt');
      statusEl.className = 'status err';
    });
});

function renderResults(){
  var tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '';
  results.forEach(function(r){
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>'+r.videoId+'</td><td class=title>'+r.title+'</td><td class=dur>'+r.formatted+' ('+r.seconds+'s)</td>';
    tbody.appendChild(tr);
  });
}

document.getElementById('exportBtn').addEventListener('click', function(){
  if(!results.length){
    document.getElementById('exportOutput').value = '(keine Ergebnisse vorhanden)';
    return;
  }
  var lines = results.map(function(r){
    return r.videoId + ': ' + r.seconds;
  });
  var jsObject = '{\n' + results.map(function(r){
    return '  "' + r.videoId + '": ' + r.seconds + ' // ' + r.formatted;
  }).join(',\n') + '\n}';
  document.getElementById('exportOutput').value = jsObject;
});
})();
</script>
</body></html>
