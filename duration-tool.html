<!DOCTYPE html><html lang=de><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Video-Daten abrufen</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f0f;color:#f0f0f0;padding:32px 20px;max-width:800px;margin:0 auto}
h1{font-size:20px;margin-bottom:8px}
.sub{font-size:13px;color:#888;margin-bottom:24px;line-height:1.5}
.card{background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;padding:20px;margin-bottom:16px}
label{font-size:13px;color:#aaa;display:block;margin-bottom:6px}
input[type=text]{font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid #3a3a3c;background:#2c2c2e;color:#f0f0f0;outline:none;width:100%;margin-bottom:12px}
textarea{width:100%;min-height:140px;background:#2c2c2e;color:#f0f0f0;border:1px solid #3a3a3c;border-radius:8px;padding:10px;font-family:monospace;font-size:12px;resize:vertical;margin-bottom:12px}
.btn{background:#2c2c2e;border:1px solid #3a3a3c;border-radius:8px;padding:9px 16px;font-size:14px;color:#f0f0f0;cursor:pointer}
.btn:hover{background:#3a3a3c}
.btn-primary{background:#fff;color:#000;border-color:#fff;font-weight:500}
.status{font-size:13px;color:#888;margin-top:10px}
.status.ok{color:#6fcf6f}
.status.err{color:#e57373}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #2c2c2e}
th{color:#888;font-weight:500}
td.num{font-family:monospace;white-space:nowrap}
td.title{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exportarea{width:100%;min-height:220px;background:#0f0f0f;color:#f0f0f0;border:1px solid #3a3a3c;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;resize:vertical;margin-top:10px}
</style></head>
<body>

<h1>⏱️ Video-Daten abrufen</h1>
<p class=sub>Video-IDs (eine pro Zeile, oder durch Komma/Leerzeichen getrennt) einfügen. Holt Laufzeit, Aufrufzahlen, Hochladedatum und Titel für alle Videos in <b>einem einzigen API-Aufruf</b> (1 Kontingent-Einheit, egal wie viele Videos).</p>

<div class=card>
<label>YouTube API-Key</label>
<input type=text id=apiKeyInput placeholder="YouTube Data API v3 Key…">
<label>Video-IDs</label>
<textarea id=idsInput placeholder="Cyu8uvA-vcc&#10;r9P08bbllno&#10;o5vxELArdA0&#10;..."></textarea>
<button class="btn btn-primary" id=fetchBtn>Daten abrufen</button>
<div class=status id=statusEl></div>
</div>

<div class=card id=resultsCard style="display:none">
<div class="status err" id=problemSummary style="display:none;margin-top:0;margin-bottom:12px"></div>
<table>
<thead><tr><th>Video-ID</th><th>Titel</th><th>Kanal</th><th>Laufzeit</th><th>Views</th><th>Hochgeladen</th></tr></thead>
<tbody id=resultsBody></tbody>
</table>
</div>

<div class=card id=exportCard style="display:none">
<button class=btn id=exportBtn>📋 Exportieren</button>
<textarea class=exportarea id=exportOutput placeholder="Exportierter Text erscheint hier…" readonly></textarea>
</div>

<script>
(function(){
var apiKeyInput = document.getElementById('apiKeyInput');
apiKeyInput.value = localStorage.getItem('youtube_api_key_duration_tool') || '';
apiKeyInput.addEventListener('change', function(){
  localStorage.setItem('youtube_api_key_duration_tool', apiKeyInput.value.trim());
});

var idsInput = document.getElementById('idsInput');
idsInput.value = localStorage.getItem('video_ids_duration_tool') || '';
idsInput.addEventListener('change', function(){
  localStorage.setItem('video_ids_duration_tool', idsInput.value);
});

function parseISO8601Duration(iso){
  if(!iso) return 0;
  var m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return 0;
  var h = parseInt(m[1]||0,10), min = parseInt(m[2]||0,10), s = parseInt(m[3]||0,10);
  return h*3600+min*60+s;
}
function formatSeconds(total){
  var h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  if(h>0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function formatDate(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getFullYear()).slice(-2);
}

function extractIds(text){
  var raw = text.split(/[\s,]+/).map(function(s){return s.trim()}).filter(Boolean);
  return raw.filter(function(id,idx){return raw.indexOf(id)===idx});
}

var results = [];

document.getElementById('fetchBtn').addEventListener('click', function(){
  var apiKey = apiKeyInput.value.trim();
  var statusEl = document.getElementById('statusEl');
  var ids = extractIds(idsInput.value);
  if(!apiKey){
    statusEl.textContent = 'Bitte API-Key eingeben.';
    statusEl.className = 'status err';
    return;
  }
  if(!ids.length){
    statusEl.textContent = 'Bitte mindestens eine Video-ID einfügen.';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = 'Lädt… (' + ids.length + ' Video-IDs)';
  statusEl.className = 'status';

  var chunks = [];
  for(var i=0; i<ids.length; i+=50) chunks.push(ids.slice(i, i+50));

  var allItems = [];
  var chunkPromises = chunks.map(function(chunk){
    var params = new URLSearchParams({part:'snippet,contentDetails,liveStreamingDetails,statistics', id: chunk.join(','), key: apiKey});
    return fetch('https://www.googleapis.com/youtube/v3/videos?'+params.toString())
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.error) throw new Error(data.error.message);
        if(data.items) allItems = allItems.concat(data.items);
      });
  });

  Promise.all(chunkPromises).then(function(){
    results = allItems.map(function(item){
      var seconds = parseISO8601Duration(item.contentDetails ? item.contentDetails.duration : null);
      var lsd = item.liveStreamingDetails;
      var isLive = lsd && lsd.actualStartTime && !lsd.actualEndTime;
      return {
        videoId: item.id,
        title: item.snippet ? item.snippet.title : '(unbekannt)',
        channelTitle: item.snippet ? item.snippet.channelTitle : '',
        seconds: isLive ? 0 : seconds,
        formatted: isLive ? 'LIVE' : formatSeconds(seconds),
        isLive: !!isLive,
        viewCount: item.statistics ? parseInt(item.statistics.viewCount||0,10) : 0,
        publishedAt: item.snippet ? item.snippet.publishedAt : null,
        publishedFormatted: item.snippet ? formatDate(item.snippet.publishedAt) : ''
      };
    });
    renderResults();
    var missing = ids.length - results.length;
    statusEl.textContent = '✓ ' + results.length + ' von ' + ids.length + ' Video(s) erhalten.' + (missing>0 ? ' (' + missing + ' nicht gefunden, evtl. gelöscht/privat)' : '');
    statusEl.className = missing === 0 ? 'status ok' : 'status err';
    document.getElementById('resultsCard').style.display = 'block';
    document.getElementById('exportCard').style.display = 'block';
  }).catch(function(err){
    statusEl.textContent = 'Fehler: ' + (err.message || 'unbekannt');
    statusEl.className = 'status err';
  });
});

function renderResults(){
  var tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '';
  var problemCount = 0;
  results.forEach(function(r){
    var tr = document.createElement('tr');
    var isProblem = r.seconds === 0 && !r.isLive;
    if(isProblem){
      tr.style.background = 'rgba(229,115,115,.15)';
      problemCount++;
    }
    tr.innerHTML = '<td>'+r.videoId+'</td><td class=title>'+r.title+'</td><td class=title>'+r.channelTitle+'</td><td class=num>'+(isProblem?'⚠️ ':'')+r.formatted+'</td><td class=num>'+r.viewCount.toLocaleString('de-DE')+'</td><td class=num>'+r.publishedFormatted+'</td>';
    tbody.appendChild(tr);
  });
  var summaryEl = document.getElementById('problemSummary');
  if(problemCount > 0){
    summaryEl.textContent = '⚠️ ' + problemCount + ' Video(s) mit 00:00 Laufzeit (nicht als Live erkannt) – evtl. ungewöhnliches Format.';
    summaryEl.style.display = 'block';
  }else{
    summaryEl.style.display = 'none';
  }
}

document.getElementById('exportBtn').addEventListener('click', function(){
  if(!results.length){
    document.getElementById('exportOutput').value = '(keine Ergebnisse vorhanden)';
    return;
  }
  var lines = results.map(function(r, i){
    return (i+1)+'. videoId: '+r.videoId+' | title: '+r.title+' | channelTitle: '+r.channelTitle+' | durationSeconds: '+r.seconds+' | isLive: '+r.isLive+' | viewCount: '+r.viewCount+' | publishedAt: '+(r.publishedAt||'');
  });
  document.getElementById('exportOutput').value = lines.join('\n');
});
})();
</script>
</body></html>
