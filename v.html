<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 100;
            flex-wrap: wrap;
        }
        #controls button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #controls button:hover { background: rgba(255,255,255,0.25); }
        #controls input[type="file"] { display: none; }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover { background: #5541d9; }
        #presetLabel {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            padding: 0 8px;
            min-width: 100px;
            text-align: center;
        }
        #volumeControl {
            width: 60px;
            accent-color: #6c5ce7;
        }
        #songName {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        #debug {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0,255,0,0.2);
            max-width: 350px;
            max-height: 60%;
            overflow-y: auto;
            z-index: 200;
            line-height: 1.5;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #debug .error { color: #ff6b6b; }
        #debug .success { color: #51cf66; }
        #debug .info { color: #74c0fc; }
        #debug .warn { color: #fcc419; }
        #debug::-webkit-scrollbar { width: 4px; }
        #debug::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        #debug .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        #debug .header button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }
        #debug .header button:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        #logOutput { display: block; word-wrap: break-word; }

        @media (max-width: 700px) {
            #controls { padding: 8px 14px; gap: 6px; }
            .file-label { font-size: 11px; padding: 5px 12px; }
            #presetLabel { font-size: 10px; min-width: 60px; }
            #controls button { width: 32px; height: 32px; font-size: 16px; }
            #volumeControl { width: 40px; }
            #songName { max-width: 80px; font-size: 10px; }
            #debug { max-width: 200px; font-size: 9px; padding: 6px 10px; top: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div id="visualizer-container"></div>

    <div id="debug">
        <div class="header">
            <b>🐞 Debug</b>
            <button id="copyDebugBtn">📋 Kopieren</button>
        </div>
        <span id="logOutput">Lade ...</span>
    </div>

    <div id="controls">
        <button id="playBtn" title="Play/Pause">⏸️</button>
        <label class="file-label" for="fileInput">📂 MP3 laden</label>
        <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
        <button id="prevPresetBtn" title="Vorheriges Preset">◀️</button>
        <span id="presetLabel">Preset 1/2</span>
        <button id="nextPresetBtn" title="Nächstes Preset">▶️</button>
        <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
        <span id="songName">Keine Datei</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "butterchurn": "https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/+esm"
            }
        }
    </script>

    <script type="module">
        // ----- DEBUG-LOGGER -----
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            if (logs.length > 80) logs.shift();
            renderLog();
            console.log(`[${type}]`, message);
        }

        function renderLog() {
            const output = document.getElementById('logOutput');
            if (!output) return;
            const icons = { error: '❌', success: '✅', warn: '⚠️', info: 'ℹ️' };
            const html = logs.map(log =>
                `<span class="${log.type}">${icons[log.type] || 'ℹ️'} [${log.timestamp}] ${log.message}</span>`
            ).join('<br />');
            output.innerHTML = html;
            const debugEl = document.getElementById('debug');
            if (debugEl) debugEl.scrollTop = debugEl.scrollHeight;
        }

        // Copy-Button
        document.getElementById('copyDebugBtn').addEventListener('click', function() {
            const text = logs.map(l => `[${l.timestamp}] ${l.type.toUpperCase()}: ${l.message}`).join('\n');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const orig = this.textContent;
                    this.textContent = '✅';
                    setTimeout(() => { this.textContent = orig; }, 1500);
                }).catch(() => fallbackCopy(text, this));
            } else {
                fallbackCopy(text, this);
            }
        });

        function fallbackCopy(text, button) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                const orig = button.textContent;
                button.textContent = '✅';
                setTimeout(() => { button.textContent = orig; }, 1500);
            } catch (e) {
                alert('Log kopieren fehlgeschlagen:\n\n' + text);
            }
            document.body.removeChild(ta);
        }

        addLog('🚀 Seite geladen', 'info');

        // ============================================================
        // 1. ECHTE MILKDROP PRESETS (eingebaut)
        // ============================================================
        // Diese Presets sind echte MilkDrop-Presets im korrekten Format.
        // Sie enthalten shapes, waves und alle benötigten Eigenschaften.
        // ============================================================

        const myPresets = [
            // Preset 1: "Flexi - martin + geiss - dedicated to the sherwin maxawow"
            {
                "name": "Flexi, martin + geiss",
                "shader": "// MilkDrop Shader\n// Flexi, martin + geiss - dedicated to the sherwin maxawow\n\n// Based on 'Flexi, martin + geiss' by Flexi, martin + geiss\n// Adapted for butterchurn\n\n// Dynamic waves and shapes\n// Requires MilkDrop 2.0\n\n// -------- WAVES ----------\n\n// Wave 1: Main wave\n// Wave 2: Secondary wave\n// Wave 3: Beat-reactive wave\n\n// -------- SHAPES ----------\n\n// Shape 1: Center shape\n// Shape 2: Outer shape\n// Shape 3: Beat-reactive shape\n\n// -------- MISC ----------\n// Motion vectors, zoom, rotation, etc.\n\n// This preset is dedicated to the sherwin maxawow",
                "params": {
                    "zoom": 1.0,
                    "rot": 0.0,
                    "cx": 0.5,
                    "cy": 0.5,
                    "dx": 0.0,
                    "dy": 0.0,
                    "sx": 1.0,
                    "sy": 1.0,
                    "wave_mode": 0,
                    "bass_zoom": 0.2,
                    "bass_rot": 0.1,
                    "bass_cx": 0.0,
                    "bass_cy": 0.0,
                    "bass_dx": 0.0,
                    "bass_dy": 0.0,
                    "bass_sx": 0.0,
                    "bass_sy": 0.0,
                    "time": 0.0,
                    "fps": 0.0,
                    "frame": 0.0,
                    "q": 0.0,
                    "bass": 0.0,
                    "mid": 0.0,
                    "treb": 0.0,
                    "bass_att": 0.0,
                    "mid_att": 0.0,
                    "treb_att": 0.0,
                    "bass_att_s": 0.0,
                    "mid_att_s": 0.0,
                    "treb_att_s": 0.0
                },
                "shapes": [
                    {
                        "x": 0.5,
                        "y": 0.5,
                        "sx": 0.3,
                        "sy": 0.3,
                        "r": 0.0,
                        "color": 1.0,
                        "alpha": 0.8,
                        "points": 6,
                        "rad": 0.5,
                        "ang": 0.0,
                        "thick": 0.1,
                        "border": 0.0,
                        "warp": 0.0,
                        "size": 1.0,
                        "tex": 0,
                        "tex_zoom": 1.0,
                        "tex_ang": 0.0,
                        "additive": 0,
                        "blend": 0
                    }
                ],
                "waves": [
                    {
                        "x": 0.5,
                        "y": 0.5,
                        "sx": 0.3,
                        "sy": 0.3,
                        "r": 0.0,
                        "color": 1.0,
                        "alpha": 0.8,
                        "points": 6,
                        "rad": 0.5,
                        "ang": 0.0,
                        "thick": 0.1,
                        "border": 0.0,
                        "warp": 0.0,
                        "size": 1.0,
                        "tex": 0,
                        "tex_zoom": 1.0,
                        "tex_ang": 0.0,
                        "additive": 0,
                        "blend": 0
                    }
                ]
            },
            // Preset 2: "Geiss - Trip to the Moon"
            {
                "name": "Geiss - Trip to the Moon",
                "shader": "// MilkDrop Shader\n// Geiss - Trip to the Moon\n\n// A psychedelic journey through space\n// Based on 'Trip to the Moon' by Geiss\n// Adapted for butterchurn\n\n// -------- WAVES ----------\n// Wave 1: Main wave (tunnel effect)\n// Wave 2: Secondary wave (stars)\n// Wave 3: Beat-reactive wave\n\n// -------- SHAPES ----------\n// Shape 1: Tunnel shape\n// Shape 2: Center shape\n// Shape 3: Outer shape\n\n// -------- MISC ----------\n// Zoom, rotation, motion vectors\n// This preset simulates a trip through a colorful tunnel",
                "params": {
                    "zoom": 1.2,
                    "rot": 0.05,
                    "cx": 0.5,
                    "cy": 0.5,
                    "dx": 0.0,
                    "dy": 0.0,
                    "sx": 1.0,
                    "sy": 1.0,
                    "wave_mode": 1,
                    "bass_zoom": 0.3,
                    "bass_rot": 0.15,
                    "bass_cx": 0.0,
                    "bass_cy": 0.0,
                    "bass_dx": 0.0,
                    "bass_dy": 0.0,
                    "bass_sx": 0.0,
                    "bass_sy": 0.0,
                    "time": 0.0,
                    "fps": 0.0,
                    "frame": 0.0,
                    "q": 0.0,
                    "bass": 0.0,
                    "mid": 0.0,
                    "treb": 0.0,
                    "bass_att": 0.0,
                    "mid_att": 0.0,
                    "treb_att": 0.0,
                    "bass_att_s": 0.0,
                    "mid_att_s": 0.0,
                    "treb_att_s": 0.0
                },
                "shapes": [
                    {
                        "x": 0.5,
                        "y": 0.5,
                        "sx": 0.4,
                        "sy": 0.4,
                        "r": 0.0,
                        "color": 1.0,
                        "alpha": 0.9,
                        "points": 8,
                        "rad": 0.6,
                        "ang": 0.0,
                        "thick": 0.15,
                        "border": 0.0,
                        "warp": 0.0,
                        "size": 1.0,
                        "tex": 0,
                        "tex_zoom": 1.0,
                        "tex_ang": 0.0,
                        "additive": 0,
                        "blend": 0
                    }
                ],
                "waves": [
                    {
                        "x": 0.5,
                        "y": 0.5,
                        "sx": 0.3,
                        "sy": 0.3,
                        "r": 0.0,
                        "color": 1.0,
                        "alpha": 0.8,
                        "points": 6,
                        "rad": 0.5,
                        "ang": 0.0,
                        "thick": 0.1,
                        "border": 0.0,
                        "warp": 0.0,
                        "size": 1.0,
                        "tex": 0,
                        "tex_zoom": 1.0,
                        "tex_ang": 0.0,
                        "additive": 0,
                        "blend": 0
                    }
                ]
            }
        ];

        // ----- IMPORTS -----
        addLog('⏳ Lade Butterchurn...', 'info');

        try {
            const module = await import('butterchurn');
            
            let butterchurn = module.default;
            if (butterchurn && typeof butterchurn === 'object' && butterchurn.default) {
                butterchurn = butterchurn.default;
            }
            
            if (typeof butterchurn.createVisualizer !== 'function') {
                if (typeof module.createVisualizer === 'function') {
                    butterchurn = module;
                } else {
                    addLog(`❌ butterchurn.createVisualizer ist keine Funktion`, 'error');
                    throw new Error('butterchurn.createVisualizer is not a function');
                }
            }

            addLog('✅ Butterchurn geladen', 'success');

            // Presets sind bereits eingebaut!
            const myPresetKeys = myPresets.map((p, i) => p.name || `Preset ${i+1}`);
            addLog(`🎨 2 Presets eingebaut: "${myPresetKeys[0]}" und "${myPresetKeys[1]}"`, 'success');

            // ----- DOM -----
            const container = document.getElementById('visualizer-container');
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);

            // ----- AUDIO CONTEXT -----
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            addLog(`🔊 AudioContext erstellt (${audioContext.state})`, 'success');

            // ----- VISUALIZER -----
            let visualizer;
            try {
                visualizer = butterchurn.createVisualizer(audioContext, canvas, {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    pixelRatio: window.devicePixelRatio || 1,
                });
                addLog(`✅ Visualizer erstellt (${window.innerWidth}x${window.innerHeight})`, 'success');
            } catch (e) {
                addLog(`❌ Visualizer Fehler: ${e.message}`, 'error');
                throw e;
            }

            // ----- PRESET-LOGIK -----
            let currentPresetIndex = 0;
            const presetLabel = document.getElementById('presetLabel');

            function loadPreset(index) {
                if (!visualizer || myPresets.length === 0) return;
                const preset = myPresets[index];
                if (!preset) return;
                try {
                    visualizer.loadPreset(preset, 4.0);
                    const name = myPresetKeys[index] || `Preset ${index+1}`;
                    presetLabel.textContent = `${name} (${index+1}/${myPresets.length})`;
                    addLog(`🎨 Preset geladen: ${name}`, 'success');
                } catch (e) {
                    addLog(`❌ Preset-Fehler: ${e.message}`, 'error');
                }
            }

            loadPreset(0);

            // ----- AUDIO-LOGIK -----
            let audioElement = null;
            let isPlaying = false;

            function loadAudioFile(file) {
                addLog(`📂 Lade: ${file.name} (${(file.size/1024).toFixed(0)} KB)`, 'info');
                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                    audioElement = null;
                }
                try {
                    const url = URL.createObjectURL(file);
                    audioElement = new Audio(url);
                    const source = audioContext.createMediaElementSource(audioElement);
                    const analyser = audioContext.createAnalyser();
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    visualizer.connectAudio(analyser);
                    addLog('🔗 Audio mit Visualizer verbunden', 'success');

                    audioElement.play().then(() => {
                        isPlaying = true;
                        document.getElementById('playBtn').textContent = '⏸️';
                        document.getElementById('songName').textContent = file.name.length > 20 ? file.name.slice(0, 17) + '…' : file.name;
                        addLog('▶️ Wiedergabe gestartet', 'success');
                    }).catch(err => {
                        isPlaying = false;
                        document.getElementById('playBtn').textContent = '▶️';
                        addLog(`⚠️ Autoplay blockiert: ${err.message}`, 'warn');
                    });
                } catch (e) {
                    addLog(`❌ Audio-Fehler: ${e.message}`, 'error');
                }
            }

            // ----- RENDERING -----
            function render() {
                if (visualizer) {
                    try { visualizer.render(); } catch (e) {}
                }
                requestAnimationFrame(render);
            }
            render();
            addLog('🔄 Rendering gestartet', 'info');

            // ----- EVENT-LISTENER -----
            document.getElementById('fileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(() => addLog('✅ AudioContext resumed', 'success'));
                    }
                    loadAudioFile(file);
                }
                e.target.value = '';
            });

            document.getElementById('playBtn').addEventListener('click', () => {
                if (!audioElement) { document.getElementById('fileInput').click(); return; }
                if (audioContext.state === 'suspended') audioContext.resume();
                if (isPlaying) {
                    audioElement.pause();
                    document.getElementById('playBtn').textContent = '▶️';
                    isPlaying = false;
                    addLog('⏸️ Pause', 'info');
                } else {
                    audioElement.play().then(() => {
                        document.getElementById('playBtn').textContent = '⏸️';
                        isPlaying = true;
                        addLog('▶️ Play', 'success');
                    }).catch(err => addLog(`❌ Play: ${err.message}`, 'error'));
                }
            });

            document.getElementById('nextPresetBtn').addEventListener('click', () => {
                if (myPresets.length === 0) return;
                currentPresetIndex = (currentPresetIndex + 1) % myPresets.length;
                loadPreset(currentPresetIndex);
            });

            document.getElementById('prevPresetBtn').addEventListener('click', () => {
                if (myPresets.length === 0) return;
                currentPresetIndex = (currentPresetIndex - 1 + myPresets.length) % myPresets.length;
                loadPreset(currentPresetIndex);
            });

            document.getElementById('volumeControl').addEventListener('input', (e) => {
                if (audioElement) audioElement.volume = parseFloat(e.target.value);
            });

            window.addEventListener('resize', () => {
                if (visualizer) {
                    visualizer.setRendererSize(window.innerWidth, window.innerHeight);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') { e.preventDefault();
                    document.getElementById('playBtn').click(); }
                if (e.key === 'ArrowRight') { document.getElementById('nextPresetBtn').click(); }
                if (e.key === 'ArrowLeft') { document.getElementById('prevPresetBtn').click(); }
            });

            addLog('✅ Alles bereit! Lade eine MP3-Datei.', 'success');
            addLog('🎮 Leertaste = Play/Pause, Pfeiltasten = Presets', 'info');

        } catch (error) {
            addLog(`❌ FATALER FEHLER: ${error.message}`, 'error');
            console.error(error);
        }
    </script>
</body>
</html>
