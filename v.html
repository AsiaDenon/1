<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Visualizer (Debug)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ----- Steuerung ----- */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
            z-index: 10;
        }
        #controls button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        #controls input[type="file"] {
            display: none;
        }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover {
            background: #5541d9;
        }
        #volumeControl {
            width: 60px;
            accent-color: #6c5ce7;
        }
        #songName {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        /* ----- DEBUG-BEREICH (oben rechts) ----- */
        #debug {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            max-width: 320px;
            max-height: 70%;
            overflow-y: auto;
            z-index: 20;
            line-height: 1.6;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        #debug .error {
            color: #ff6b6b;
        }
        #debug .success {
            color: #51cf66;
        }
        #debug .info {
            color: #74c0fc;
        }
        #debug .warn {
            color: #fcc419;
        }
        #debug::-webkit-scrollbar {
            width: 4px;
        }
        #debug::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        @media (max-width: 700px) {
            #debug {
                top: 10px;
                right: 10px;
                font-size: 10px;
                padding: 8px 12px;
                max-width: 200px;
                max-height: 50%;
            }
            #controls { padding: 8px 12px; gap: 6px; }
            .file-label { font-size: 11px; padding: 5px 12px; }
            #songName { max-width: 80px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="visualizer-canvas"></canvas>

        <!-- DEBUG-BEREICH -->
        <div id="debug">
            🐞 <b>Debug-Log</b><br />
            <span id="logOutput">Initialisiere ...</span>
        </div>

        <!-- STEUERUNG -->
        <div id="controls">
            <button id="playBtn" title="Play / Pause">⏸️</button>
            <label class="file-label" for="fileInput">📂 MP3 laden</label>
            <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
            <button id="nextPresetBtn" title="Nächstes Preset">🎨</button>
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
            <span id="songName">Keine Datei</span>
        </div>
    </div>

    <!-- Bibliotheken als UMD (normale Scripts) laden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/butterchurn/2.6.7/butterchurn.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.6.7/dist/butterchurn-presets.min.js">
    </script>

    <!-- Hauptskript (kein Modul, einfaches JS) -->
    <script>
        // ----- Debug-Logger (global) -----
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            if (logs.length > 50) logs.shift();
            renderLog();
            console.log(`[${type}]`, message);
        }

        function renderLog() {
            const output = document.getElementById('logOutput');
            if (!output) return;
            const html = logs.map(log => {
                const cls = log.type;
                return `<span class="${cls}">[${log.timestamp}] ${log.message}</span>`;
            }).join('<br />');
            output.innerHTML = html;
            const debugEl = document.getElementById('debug');
            if (debugEl) debugEl.scrollTop = debugEl.scrollHeight;
        }

        // Sofort eine erste Meldung
        addLog('🚀 Seite geladen', 'info');

        // ----- Prüfen ob Bibliotheken geladen sind -----
        if (typeof butterchurn === 'undefined') {
            addLog('❌ butterchurn nicht geladen!', 'error');
        } else {
            addLog('✅ butterchurn geladen (Version ' + (butterchurn.version || '?') + ')', 'success');
        }
        if (typeof butterchurnPresets === 'undefined') {
            addLog('❌ butterchurnPresets nicht geladen!', 'error');
        } else {
            addLog('✅ butterchurnPresets geladen', 'success');
        }

        // ----- DOM-Elemente -----
        const canvas = document.getElementById('visualizer-canvas');
        const container = document.getElementById('container');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const volumeControl = document.getElementById('volumeControl');
        const songName = document.getElementById('songName');
        const nextPresetBtn = document.getElementById('nextPresetBtn');

        // ----- AudioContext & Visualizer (erst wenn Bibliotheken da) -----
        let audioContext = null;
        let visualizer = null;
        let currentSourceNode = null;
        let currentAnalyser = null;
        let currentAudioElement = null;
        let isPlaying = false;
        let presetKeys = [];

        function initVisualizer() {
            if (typeof butterchurn === 'undefined') {
                addLog('❌ Butterchurn nicht verfügbar – Initialisierung abgebrochen', 'error');
                return;
            }

            try {
                audioContext = new(window.AudioContext || window.webkitAudioContext)();
                addLog(`✅ AudioContext erstellt (State: ${audioContext.state})`, 'success');

                const width = container.clientWidth;
                const height = container.clientHeight;

                visualizer = butterchurn.createVisualizer(audioContext, canvas, {
                    width: width,
                    height: height,
                    pixelRatio: window.devicePixelRatio || 1,
                });
                addLog(`✅ Visualizer erstellt (${width}x${height})`, 'success');

                // Presets laden
                if (typeof butterchurnPresets !== 'undefined') {
                    const presets = butterchurnPresets.getPresets();
                    presetKeys = Object.keys(presets);
                    addLog(`✅ ${presetKeys.length} Presets geladen`, 'success');
                    loadRandomPreset();
                } else {
                    addLog('⚠️ Keine Presets – verwende Standard', 'warn');
                }

                // Rendering starten
                renderLoop();

            } catch (e) {
                addLog(`❌ Fehler bei Initialisierung: ${e.message}`, 'error');
                console.error(e);
            }
        }

        function loadRandomPreset() {
            if (!visualizer) return;
            if (presetKeys.length === 0) {
                addLog('⚠️ Keine Presets verfügbar', 'warn');
                return;
            }
            try {
                const idx = Math.floor(Math.random() * presetKeys.length);
                const presets = butterchurnPresets.getPresets();
                visualizer.loadPreset(presets[presetKeys[idx]], 0.0);
                addLog(`🎨 Preset: ${presetKeys[idx].slice(0, 40)}...`, 'info');
            } catch (e) {
                addLog(`❌ Preset-Fehler: ${e.message}`, 'error');
            }
        }

        // ----- Rendering-Schleife -----
        let renderErrorLogged = false;

        function renderLoop() {
            if (visualizer) {
                try {
                    visualizer.render();
                } catch (e) {
                    if (!renderErrorLogged) {
                        addLog(`❌ Render-Fehler: ${e.message}`, 'error');
                        renderErrorLogged = true;
                    }
                }
            }
            requestAnimationFrame(renderLoop);
        }

        // ----- Datei auswählen (doppelt abgesichert) -----
        function handleFileSelect(event) {
            const file = event.target.files[0];
            addLog(`📂 Datei ausgewählt: ${file ? file.name : 'keine'}`, 'info');

            if (!file) {
                songName.textContent = '❌ Keine Datei';
                return;
            }

            // Dateiname anzeigen
            const displayName = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
            songName.textContent = displayName;

            // AudioContext starten (falls suspendiert)
            if (audioContext && audioContext.state === 'suspended') {
                addLog('⏳ AudioContext wird resumed...', 'warn');
                audioContext.resume().then(() => {
                    addLog(`✅ AudioContext resumed (State: ${audioContext.state})`, 'success');
                }).catch(err => {
                    addLog(`❌ Resume fehlgeschlagen: ${err.message}`, 'error');
                });
            }

            // Alte Verbindungen trennen
            try {
                if (currentSourceNode) {
                    currentSourceNode.disconnect();
                    currentSourceNode = null;
                }
                if (currentAudioElement) {
                    currentAudioElement.pause();
                    currentAudioElement.src = '';
                    currentAudioElement = null;
                }
            } catch (e) { /* ignoriere */ }

            // Neues Audio-Element
            try {
                const audioElement = new Audio();
                const objectUrl = URL.createObjectURL(file);
                audioElement.src = objectUrl;
                audioElement.loop = false;
                audioElement.volume = volumeControl.value;

                if (!audioContext) {
                    addLog('❌ Kein AudioContext – erstelle neuen', 'error');
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                }

                const source = audioContext.createMediaElementSource(audioElement);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;

                source.connect(analyser);
                analyser.connect(audioContext.destination);
                if (visualizer) {
                    visualizer.connectAudio(analyser);
                } else {
                    addLog('⚠️ Visualizer nicht bereit – Audio wird nicht visualisiert', 'warn');
                }

                currentSourceNode = source;
                currentAnalyser = analyser;
                currentAudioElement = audioElement;

                // Automatisch abspielen
                audioElement.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                    addLog('✅ Wiedergabe gestartet 🎵', 'success');
                }).catch(err => {
                    addLog(`⚠️ Autoplay blockiert: ${err.message} – klicke Play`, 'warn');
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                });

                fileInput.value = '';

            } catch (error) {
                addLog(`❌ Fehler beim Laden: ${error.message}`, 'error');
                console.error(error);
                songName.textContent = '❌ Fehler';
            }
        }

        // Event-Listener für File-Input (zwei Varianten zur Sicherheit)
        fileInput.addEventListener('change', handleFileSelect);
        fileInput.onchange = handleFileSelect; // Fallback

        // ----- Play / Pause -----
        playBtn.addEventListener('click', function() {
            if (!currentAudioElement) {
                fileInput.click();
                return;
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                currentAudioElement.pause();
                playBtn.textContent = '▶️';
                isPlaying = false;
                addLog('⏸️ Pause', 'info');
            } else {
                currentAudioElement.play().then(() => {
                    playBtn.textContent = '⏸️';
                    isPlaying = true;
                    addLog('▶️ Wiedergabe gestartet', 'success');
                }).catch(err => {
                    addLog(`❌ Play fehlgeschlagen: ${err.message}`, 'error');
                });
            }
        });

        // ----- Nächstes Preset -----
        nextPresetBtn.addEventListener('click', function() {
            loadRandomPreset();
        });

        // ----- Lautstärke -----
        volumeControl.addEventListener('input', function() {
            if (currentAudioElement) {
                currentAudioElement.volume = volumeControl.value;
            }
        });

        // ----- Größenänderung -----
        window.addEventListener('resize', function() {
            if (visualizer) {
                const w = container.clientWidth;
                const h = container.clientHeight;
                visualizer.setRendererSize(w, h);
            }
        });

        // ----- Tastatur (Leertaste) -----
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                playBtn.click();
            }
        });

        // ----- Starte den Visualizer, sobald Bibliotheken geladen sind -----
        if (typeof butterchurn !== 'undefined' && typeof butterchurnPresets !== 'undefined') {
            initVisualizer();
        } else {
            // Warte auf die Bibliotheken (maximal 5 Sekunden)
            let attempts = 0;
            const waitInterval = setInterval(() => {
                attempts++;
                if (typeof butterchurn !== 'undefined' && typeof butterchurnPresets !== 'undefined') {
                    clearInterval(waitInterval);
                    addLog('✅ Bibliotheken nachgeladen, starte Visualizer', 'success');
                    initVisualizer();
                } else if (attempts > 20) {
                    clearInterval(waitInterval);
                    addLog('❌ Bibliotheken nicht geladen – bitte Seite neu laden oder CDN prüfen', 'error');
                }
            }, 250);
        }

        addLog('💡 Wähle eine MP3-Datei aus – das Debug-Log zeigt jeden Schritt.', 'info');
    </script>
</body>
</html>
