<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Visualizer (Debug)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ----- Steuerung ----- */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
            z-index: 10;
        }
        #controls button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        #controls input[type="file"] {
            display: none;
        }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover {
            background: #5541d9;
        }
        #volumeControl {
            width: 60px;
            accent-color: #6c5ce7;
        }
        #songName {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        /* ----- DEBUG-BEREICH (oben rechts) ----- */
        #debug {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            max-width: 360px;
            max-height: 70%;
            overflow-y: auto;
            z-index: 20;
            line-height: 1.6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        #debug .error {
            color: #ff6b6b;
        }
        #debug .success {
            color: #51cf66;
        }
        #debug .info {
            color: #74c0fc;
        }
        #debug .warn {
            color: #fcc419;
        }
        #debug::-webkit-scrollbar {
            width: 4px;
        }
        #debug::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        #debug .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        #debug .header button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #aaa;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }
        #debug .header button:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        #logOutput {
            display: block;
            word-wrap: break-word;
        }

        @media (max-width: 700px) {
            #debug {
                top: 10px;
                right: 10px;
                font-size: 10px;
                padding: 8px 12px;
                max-width: 200px;
                max-height: 50%;
            }
            #controls { padding: 8px 12px; gap: 6px; }
            .file-label { font-size: 11px; padding: 5px 12px; }
            #songName { max-width: 80px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="visualizer-canvas"></canvas>

        <!-- DEBUG-BEREICH mit Copy-Button -->
        <div id="debug">
            <div class="header">
                <b>🐞 Debug-Log</b>
                <button id="copyDebugBtn" title="Log in die Zwischenablage kopieren">📋 Kopieren</button>
            </div>
            <span id="logOutput">Initialisiere ...</span>
        </div>

        <!-- STEUERUNG -->
        <div id="controls">
            <button id="playBtn" title="Play / Pause">⏸️</button>
            <label class="file-label" for="fileInput">📂 MP3 laden</label>
            <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
            <button id="nextPresetBtn" title="Nächstes Preset">🎨</button>
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
            <span id="songName">Keine Datei</span>
        </div>
    </div>

    <!-- Bibliotheken als UMD (normale Scripts) laden – VERSCHIEDENE CDNs -->
    <script src="https://unpkg.com/butterchurn@2.6.7/dist/butterchurn.min.js">
    </script>
    <script src="https://unpkg.com/butterchurn-presets@2.6.7/dist/butterchurn-presets.min.js">
    </script>

    <!-- FALLBACK: Falls unpkg nicht geht, lade von cdnjs -->
    <script>
        // Prüfe nach 2 Sekunden, ob die Bibliotheken geladen sind
        setTimeout(function() {
            if (typeof butterchurn === 'undefined') {
                // Lade von cdnjs nach
                var script1 = document.createElement('script');
                script1.src = 'https://cdnjs.cloudflare.com/ajax/libs/butterchurn/2.6.7/butterchurn.min.js';
                document.head.appendChild(script1);
            }
            if (typeof butterchurnPresets === 'undefined') {
                var script2 = document.createElement('script');
                script2.src = 'https://cdnjs.cloudflare.com/ajax/libs/butterchurn-presets/2.6.7/butterchurn-presets.min.js';
                document.head.appendChild(script2);
            }
        }, 2000);
    </script>

    <!-- Hauptskript -->
    <script>
        // ----- Debug-Logger -----
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            if (logs.length > 100) logs.shift();
            renderLog();
            console.log(`[${type}]`, message);
        }

        function renderLog() {
            const output = document.getElementById('logOutput');
            if (!output) return;
            const html = logs.map(log => {
                const cls = log.type;
                const icon = log.type === 'error' ? '❌' :
                    log.type === 'success' ? '✅' :
                    log.type === 'warn' ? '⚠️' : 'ℹ️';
                return `<span class="${cls}">${icon} [${log.timestamp}] ${log.message}</span>`;
            }).join('<br />');
            output.innerHTML = html;
            const debugEl = document.getElementById('debug');
            if (debugEl) debugEl.scrollTop = debugEl.scrollHeight;
        }

        // ----- Copy-Button -----
        document.getElementById('copyDebugBtn').addEventListener('click', function() {
            const text = logs.map(log => `[${log.timestamp}] ${log.type.toUpperCase()}: ${log.message}`).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = this;
                const orig = btn.textContent;
                btn.textContent = '✅ Kopiert!';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            }).catch(() => {
                // Fallback: manuell kopieren
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Log kopiert!');
            });
        });

        // Sofort erste Meldung
        addLog('🚀 Seite geladen', 'info');

        // ----- DOM -----
        const canvas = document.getElementById('visualizer-canvas');
        const container = document.getElementById('container');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const volumeControl = document.getElementById('volumeControl');
        const songName = document.getElementById('songName');
        const nextPresetBtn = document.getElementById('nextPresetBtn');

        // ----- Globale Variablen -----
        let audioContext = null;
        let visualizer = null;
        let currentSourceNode = null;
        let currentAnalyser = null;
        let currentAudioElement = null;
        let isPlaying = false;
        let presetKeys = [];
        let isInitialized = false;

        // ----- Visualizer initialisieren -----
        function initVisualizer() {
            if (isInitialized) return;
            if (typeof butterchurn === 'undefined') {
                addLog('⏳ Warte auf butterchurn...', 'warn');
                setTimeout(initVisualizer, 500);
                return;
            }

            try {
                audioContext = new(window.AudioContext || window.webkitAudioContext)();
                addLog(`✅ AudioContext erstellt (State: ${audioContext.state})`, 'success');

                const width = container.clientWidth;
                const height = container.clientHeight;

                visualizer = butterchurn.createVisualizer(audioContext, canvas, {
                    width: width,
                    height: height,
                    pixelRatio: window.devicePixelRatio || 1,
                });
                addLog(`✅ Visualizer erstellt (${width}x${height})`, 'success');

                // Presets laden
                if (typeof butterchurnPresets !== 'undefined') {
                    try {
                        const presets = butterchurnPresets.getPresets();
                        presetKeys = Object.keys(presets);
                        addLog(`✅ ${presetKeys.length} Presets geladen`, 'success');
                        loadRandomPreset();
                    } catch (e) {
                        addLog(`⚠️ Presets laden fehlgeschlagen: ${e.message}`, 'warn');
                    }
                } else {
                    addLog('⚠️ Keine Presets – verwende Fallback', 'warn');
                }

                isInitialized = true;
                renderLoop();
                addLog('✅ Bereit – lade eine MP3!', 'success');

            } catch (e) {
                addLog(`❌ Fehler: ${e.message}`, 'error');
                console.error(e);
                setTimeout(initVisualizer, 1000);
            }
        }

        function loadRandomPreset() {
            if (!visualizer) return;
            if (presetKeys.length === 0) {
                addLog('⚠️ Keine Presets verfügbar', 'warn');
                return;
            }
            try {
                const idx = Math.floor(Math.random() * presetKeys.length);
                const presets = butterchurnPresets.getPresets();
                visualizer.loadPreset(presets[presetKeys[idx]], 0.0);
                addLog(`🎨 Preset: ${presetKeys[idx].slice(0, 40)}...`, 'info');
            } catch (e) {
                addLog(`❌ Preset-Fehler: ${e.message}`, 'error');
            }
        }

        // ----- Rendering -----
        let renderErrorLogged = false;

        function renderLoop() {
            if (visualizer) {
                try {
                    visualizer.render();
                } catch (e) {
                    if (!renderErrorLogged) {
                        addLog(`❌ Render-Fehler: ${e.message}`, 'error');
                        renderErrorLogged = true;
                    }
                }
            }
            requestAnimationFrame(renderLoop);
        }

        // ----- Datei auswählen -----
        function handleFileSelect(event) {
            const file = event.target.files[0];
            addLog(`📂 Datei: ${file ? file.name : 'keine'}`, 'info');

            if (!file) {
                songName.textContent = '❌ Keine Datei';
                return;
            }

            const displayName = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
            songName.textContent = displayName;
            addLog(`📄 ${file.name} (${(file.size / 1024).toFixed(0)} KB)`, 'info');

            // AudioContext starten
            if (!audioContext) {
                addLog('⏳ AudioContext wird erstellt...', 'warn');
                audioContext = new(window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    addLog(`✅ AudioContext resumed (${audioContext.state})`, 'success');
                }).catch(err => {
                    addLog(`❌ Resume fehlgeschlagen: ${err.message}`, 'error');
                });
            }

            // Alte Verbindungen trennen
            try {
                if (currentSourceNode) { currentSourceNode.disconnect();
                    currentSourceNode = null; }
                if (currentAudioElement) {
                    currentAudioElement.pause();
                    currentAudioElement.src = '';
                    currentAudioElement = null;
                }
            } catch (e) { /* ignoriere */ }

            // Neues Audio-Element
            try {
                const audioElement = new Audio();
                const objectUrl = URL.createObjectURL(file);
                audioElement.src = objectUrl;
                audioElement.loop = false;
                audioElement.volume = volumeControl.value;

                const source = audioContext.createMediaElementSource(audioElement);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;

                source.connect(analyser);
                analyser.connect(audioContext.destination);

                if (visualizer) {
                    visualizer.connectAudio(analyser);
                    addLog('🔗 Audio mit Visualizer verbunden', 'success');
                } else {
                    addLog('⚠️ Visualizer nicht bereit – nur Audio', 'warn');
                }

                currentSourceNode = source;
                currentAnalyser = analyser;
                currentAudioElement = audioElement;

                // Abspielen
                audioElement.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                    addLog('✅ Wiedergabe gestartet 🎵', 'success');
                }).catch(err => {
                    addLog(`⚠️ Autoplay blockiert: ${err.message}`, 'warn');
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                });

                fileInput.value = '';

            } catch (error) {
                addLog(`❌ Fehler: ${error.message}`, 'error');
                console.error(error);
                songName.textContent = '❌ Fehler';
            }
        }

        // ----- Event-Listener -----
        fileInput.addEventListener('change', handleFileSelect);

        playBtn.addEventListener('click', function() {
            if (!currentAudioElement) { fileInput.click(); return; }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                currentAudioElement.pause();
                playBtn.textContent = '▶️';
                isPlaying = false;
                addLog('⏸️ Pause', 'info');
            } else {
                currentAudioElement.play().then(() => {
                    playBtn.textContent = '⏸️';
                    isPlaying = true;
                    addLog('▶️ Wiedergabe', 'success');
                }).catch(err => {
                    addLog(`❌ Play fehlgeschlagen: ${err.message}`, 'error');
                });
            }
        });

        nextPresetBtn.addEventListener('click', function() {
            if (!visualizer) {
                addLog('⚠️ Visualizer nicht bereit', 'warn');
                return;
            }
            loadRandomPreset();
        });

        volumeControl.addEventListener('input', function() {
            if (currentAudioElement) {
                currentAudioElement.volume = volumeControl.value;
            }
        });

        window.addEventListener('resize', function() {
            if (visualizer) {
                visualizer.setRendererSize(container.clientWidth, container.clientHeight);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault();
                playBtn.click(); }
        });

        // ----- Starte Initialisierung -----
        addLog('⏳ Lade butterchurn von CDN...', 'info');
        initVisualizer();

        // Prüfe nach 5 Sekunden, ob Visualizer da ist
        setTimeout(function() {
            if (!isInitialized) {
                addLog('⏳ Visualizer noch nicht bereit – versuche erneut...', 'warn');
                initVisualizer();
            }
        }, 5000);

        addLog('💡 Wähle eine MP3-Datei', 'info');
    </script>
</body>
</html>
