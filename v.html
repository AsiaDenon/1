<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Debug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ----- Steuerung ----- */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
            z-index: 10;
        }
        #controls button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        #controls input[type="file"] {
            display: none;
        }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover {
            background: #5541d9;
        }
        #volumeControl {
            width: 60px;
            accent-color: #6c5ce7;
        }
        #songName {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        /* ----- DEBUG-BEREICH (oben rechts) ----- */
        #debug {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            max-width: 320px;
            max-height: 70%;
            overflow-y: auto;
            z-index: 20;
            line-height: 1.6;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        #debug .error {
            color: #ff6b6b;
        }
        #debug .success {
            color: #51cf66;
        }
        #debug .info {
            color: #74c0fc;
        }
        #debug .warn {
            color: #fcc419;
        }
        #debug::-webkit-scrollbar {
            width: 4px;
        }
        #debug::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        @media (max-width: 700px) {
            #debug {
                top: 10px;
                right: 10px;
                font-size: 10px;
                padding: 8px 12px;
                max-width: 200px;
                max-height: 50%;
            }
            #controls { padding: 8px 12px; gap: 6px; }
            .file-label { font-size: 11px; padding: 5px 12px; }
            #songName { max-width: 80px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="visualizer-canvas"></canvas>

        <!-- DEBUG-BEREICH -->
        <div id="debug">
            🐞 <b>Debug-Log</b><br />
            <span id="logOutput">Warte auf Aktion...</span>
        </div>

        <!-- STEUERUNG -->
        <div id="controls">
            <button id="playBtn" title="Play / Pause">⏸️</button>
            <label class="file-label" for="fileInput">📂 MP3 laden</label>
            <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
            <button id="nextPresetBtn" title="Nächstes Preset">🎨</button>
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
            <span id="songName">Keine Datei</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "butterchurn": "https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/+esm",
                "butterchurn-presets": "https://cdn.jsdelivr.net/npm/butterchurn-presets@2.6.7/+esm"
            }
        }
    </script>

    <script type="module">
        import butterchurn from 'butterchurn';
        import butterchurnPresets from 'butterchurn-presets';

        // ----- DOM -----
        const canvas = document.getElementById('visualizer-canvas');
        const container = document.getElementById('container');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const volumeControl = document.getElementById('volumeControl');
        const songName = document.getElementById('songName');
        const nextPresetBtn = document.getElementById('nextPresetBtn');
        const logOutput = document.getElementById('logOutput');

        // ----- DEBUG-LOGGER -----
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            // Nur die letzten 50 Einträge behalten
            if (logs.length > 50) logs.shift();
            renderLog();
            console.log(`[${type}]`, message);
        }

        function renderLog() {
            const html = logs.map(log => {
                const cls = log.type;
                return `<span class="${cls}">[${log.timestamp}] ${log.message}</span>`;
            }).join('<br />');
            logOutput.innerHTML = html;
            // Automatisch nach unten scrollen (im Debug-Container)
            const debugEl = document.getElementById('debug');
            debugEl.scrollTop = debugEl.scrollHeight;
        }

        addLog('🚀 Seite geladen, initialisiere...', 'info');

        // ----- AudioContext & Visualizer -----
        let audioContext;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            addLog(`✅ AudioContext erstellt (State: ${audioContext.state})`, 'success');
        } catch (e) {
            addLog(`❌ AudioContext Fehler: ${e.message}`, 'error');
        }

        const width = container.clientWidth;
        const height = container.clientHeight;

        let visualizer;
        try {
            visualizer = butterchurn.createVisualizer(audioContext, canvas, {
                width: width,
                height: height,
                pixelRatio: window.devicePixelRatio || 1,
            });
            addLog(`✅ Visualizer erstellt (${width}x${height})`, 'success');
        } catch (e) {
            addLog(`❌ Visualizer Fehler: ${e.message}`, 'error');
        }

        // ----- Presets -----
        let presetKeys = [];
        try {
            const presets = butterchurnPresets.getPresets();
            presetKeys = Object.keys(presets);
            addLog(`✅ ${presetKeys.length} Presets geladen`, 'success');
        } catch (e) {
            addLog(`❌ Presets Fehler: ${e.message}`, 'error');
        }

        function loadRandomPreset() {
            if (presetKeys.length === 0) {
                addLog('⚠️ Keine Presets verfügbar', 'warn');
                return;
            }
            try {
                const idx = Math.floor(Math.random() * presetKeys.length);
                const presets = butterchurnPresets.getPresets();
                visualizer.loadPreset(presets[presetKeys[idx]], 0.0);
                addLog(`🎨 Preset geladen: ${presetKeys[idx].slice(0, 40)}...`, 'info');
            } catch (e) {
                addLog(`❌ Preset-Fehler: ${e.message}`, 'error');
            }
        }
        loadRandomPreset();

        // ----- Zustand -----
        let currentSourceNode = null;
        let currentAnalyser = null;
        let currentAudioElement = null;
        let isPlaying = false;

        // ----- Datei auswählen (mit Debug) -----
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            addLog(`📂 Datei ausgewählt: ${file ? file.name : 'keine'}`, 'info');

            if (!file) {
                addLog('⚠️ Keine Datei im Input', 'warn');
                songName.textContent = '❌ Keine Datei';
                return;
            }

            // Prüfen ob Datei wirklich lesbar ist
            if (file.size === 0) {
                addLog('❌ Datei ist leer (0 Bytes)', 'error');
                songName.textContent = '❌ Leere Datei';
                return;
            }

            // Dateiname anzeigen
            const displayName = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
            songName.textContent = displayName;
            addLog(`📄 Dateiname: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`, 'info');

            // Alte Verbindungen trennen
            try {
                if (currentSourceNode) {
                    currentSourceNode.disconnect();
                    currentSourceNode = null;
                    addLog('🔌 Alte Quelle getrennt', 'info');
                }
                if (currentAudioElement) {
                    currentAudioElement.pause();
                    currentAudioElement.src = '';
                    currentAudioElement = null;
                    addLog('⏹️ Altes Audio-Element gestoppt', 'info');
                }
            } catch (e) {
                addLog(`⚠️ Fehler beim Trennen: ${e.message}`, 'warn');
            }

            // AudioContext starten (falls nötig) – WICHTIG!
            if (audioContext.state === 'suspended') {
                addLog('⏳ AudioContext ist suspended – versuche zu resume...', 'warn');
                audioContext.resume().then(() => {
                    addLog(`✅ AudioContext resumed (State: ${audioContext.state})`, 'success');
                }).catch(err => {
                    addLog(`❌ Resume fehlgeschlagen: ${err.message}`, 'error');
                    songName.textContent = '❌ AudioContext Fehler';
                    return;
                });
            }

            // Audio-Element erstellen
            try {
                const audioElement = new Audio();
                const objectUrl = URL.createObjectURL(file);
                audioElement.src = objectUrl;
                audioElement.loop = false;
                audioElement.volume = volumeControl.value;
                addLog(`🔊 Audio-Element erstellt, URL: ${objectUrl.slice(0, 40)}...`, 'info');

                // MediaElementSource
                const source = audioContext.createMediaElementSource(audioElement);
                addLog('🔗 MediaElementSource erstellt', 'success');

                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                addLog(`📊 Analyser erstellt (fftSize: ${analyser.fftSize})`, 'success');

                // Verbinden
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                visualizer.connectAudio(analyser);
                addLog('🔗 Audio-Pfad verbunden: Quelle → Analyser → Destination + Visualizer', 'success');

                currentSourceNode = source;
                currentAnalyser = analyser;
                currentAudioElement = audioElement;

                // AUTOMATISCH ABSPIELEN
                addLog('▶️ Versuche automatische Wiedergabe...', 'info');
                audioElement.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                    addLog('✅ Wiedergabe erfolgreich gestartet! 🎵', 'success');
                }).catch(err => {
                    addLog(`⚠️ Autoplay blockiert: ${err.message}`, 'warn');
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                    songName.textContent = '⏸️ ' + displayName;
                    // Zeige dem Nutzer, dass er klicken muss
                    addLog('👉 Bitte auf Play-Button klicken, um zu starten', 'info');
                });

                fileInput.value = '';

            } catch (error) {
                addLog(`❌ Fehler beim Laden: ${error.message}`, 'error');
                console.error(error);
                songName.textContent = '❌ Fehler: ' + error.message.slice(0, 30);
            }
        });

        // ----- Play / Pause -----
        playBtn.addEventListener('click', () => {
            addLog(`🔄 Play/Pause geklickt (AudioContext: ${audioContext.state})`, 'info');

            if (!currentAudioElement) {
                addLog('📂 Kein Song geladen – öffne Datei-Dialog', 'info');
                fileInput.click();
                return;
            }

            if (audioContext.state === 'suspended') {
                addLog('⏳ AudioContext wird resumed...', 'warn');
                audioContext.resume().then(() => {
                    addLog(`✅ AudioContext resumed (State: ${audioContext.state})`, 'success');
                }).catch(err => {
                    addLog(`❌ Resume fehlgeschlagen: ${err.message}`, 'error');
                });
            }

            if (isPlaying) {
                currentAudioElement.pause();
                playBtn.textContent = '▶️';
                isPlaying = false;
                addLog('⏸️ Pause', 'info');
            } else {
                currentAudioElement.play().then(() => {
                    addLog('▶️ Wiedergabe gestartet', 'success');
                    playBtn.textContent = '⏸️';
                    isPlaying = true;
                }).catch(err => {
                    addLog(`❌ Play fehlgeschlagen: ${err.message}`, 'error');
                });
            }
        });

        // ----- Nächstes Preset -----
        nextPresetBtn.addEventListener('click', () => {
            addLog('🎨 Nächstes Preset angefordert', 'info');
            loadRandomPreset();
        });

        // ----- Lautstärke -----
        volumeControl.addEventListener('input', () => {
            if (currentAudioElement) {
                currentAudioElement.volume = volumeControl.value;
                addLog(`🔊 Lautstärke: ${volumeControl.value}`, 'info');
            }
        });

        // ----- Größenänderung -----
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (visualizer) {
                visualizer.setRendererSize(w, h);
                addLog(`📐 Größe angepasst: ${w}x${h}`, 'info');
            }
        });

        // ----- Rendering-Schleife -----
        function render() {
            if (visualizer) {
                try {
                    visualizer.render();
                } catch (e) {
                    // Nur einmal loggen, nicht jede Frame
                    if (!render._errorLogged) {
                        addLog(`❌ Render-Fehler: ${e.message}`, 'error');
                        render._errorLogged = true;
                    }
                }
            }
            requestAnimationFrame(render);
        }
        render();
        addLog('🔄 Rendering-Schleife gestartet', 'info');

        // ----- Tastatur (Leertaste) -----
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                playBtn.click();
            }
        });

        addLog('✅ Bereit – lade eine MP3-Datei hoch!', 'success');
        addLog('💡 Tipp: Öffne die Browser-Konsole (F12) für mehr Details', 'info');
    </script>
</body>
</html>
