<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Steuerung */
        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 100;
            flex-wrap: wrap;
        }
        #controls button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #controls button:hover { background: rgba(255,255,255,0.25); }
        #controls input[type="file"] { display: none; }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover { background: #5541d9; }
        #presetLabel {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            padding: 0 8px;
            min-width: 100px;
            text-align: center;
        }
        #volumeControl {
            width: 60px;
            accent-color: #6c5ce7;
        }
        #songName {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        /* Debug */
        #debug {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0,255,0,0.2);
            max-width: 350px;
            max-height: 60%;
            overflow-y: auto;
            z-index: 200;
            line-height: 1.5;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #debug .error { color: #ff6b6b; }
        #debug .success { color: #51cf66; }
        #debug .info { color: #74c0fc; }
        #debug .warn { color: #fcc419; }
        #debug::-webkit-scrollbar { width: 4px; }
        #debug::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        #debug .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        #debug .header button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }
        #debug .header button:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        #logOutput { display: block; word-wrap: break-word; }

        @media (max-width: 700px) {
            #controls { padding: 8px 14px; gap: 6px; }
            .file-label { font-size: 11px; padding: 5px 12px; }
            #presetLabel { font-size: 10px; min-width: 60px; }
            #controls button { width: 32px; height: 32px; font-size: 16px; }
            #volumeControl { width: 40px; }
            #songName { max-width: 80px; font-size: 10px; }
            #debug { max-width: 200px; font-size: 9px; padding: 6px 10px; top: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div id="visualizer-container"></div>

    <!-- Debug -->
    <div id="debug">
        <div class="header">
            <b>🐞 Debug</b>
            <button id="copyDebugBtn">📋 Kopieren</button>
        </div>
        <span id="logOutput">Lade ...</span>
    </div>

    <!-- Steuerung -->
    <div id="controls">
        <button id="playBtn" title="Play/Pause">⏸️</button>
        <label class="file-label" for="fileInput">📂 MP3 laden</label>
        <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
        <button id="prevPresetBtn" title="Vorheriges Preset">◀️</button>
        <span id="presetLabel">Preset 1/2</span>
        <button id="nextPresetBtn" title="Nächstes Preset">▶️</button>
        <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
        <span id="songName">Keine Datei</span>
    </div>

    <!-- Butterchurn per Import Map laden -->
    <script type="importmap">
        {
            "imports": {
                "butterchurn": "https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/+esm",
                "butterchurn-presets": "https://cdn.jsdelivr.net/npm/butterchurn-presets@2.6.7/+esm"
            }
        }
    </script>

    <script type="module">
        // ----- Debug-Logger -----
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            if (logs.length > 80) logs.shift();
            renderLog();
            console.log(`[${type}]`, message);
        }

        function renderLog() {
            const output = document.getElementById('logOutput');
            if (!output) return;
            const icons = { error: '❌', success: '✅', warn: '⚠️', info: 'ℹ️' };
            const html = logs.map(log =>
                `<span class="${log.type}">${icons[log.type] || 'ℹ️'} [${log.timestamp}] ${log.message}</span>`
            ).join('<br />');
            output.innerHTML = html;
            const debugEl = document.getElementById('debug');
            if (debugEl) debugEl.scrollTop = debugEl.scrollHeight;
        }

        document.getElementById('copyDebugBtn').addEventListener('click', async function() {
            const text = logs.map(l => `[${l.timestamp}] ${l.type.toUpperCase()}: ${l.message}`).join('\n');
            try {
                await navigator.clipboard.writeText(text);
                const orig = this.textContent;
                this.textContent = '✅';
                setTimeout(() => { this.textContent = orig; }, 1500);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Kopiert!');
            }
        });

        addLog('🚀 Seite geladen', 'info');

        // ----- Imports -----
        import butterchurn from 'butterchurn';
        import butterchurnPresets from 'butterchurn-presets';

        addLog('📦 Bibliotheken geladen', 'success');

        // ----- DOM -----
        const container = document.getElementById('visualizer-container');
        const canvas = document.createElement('canvas');
        container.appendChild(canvas);

        // ----- Audio Context -----
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        addLog(`🔊 AudioContext erstellt (${audioContext.state})`, 'success');

        // ----- Visualizer -----
        let visualizer;
        try {
            visualizer = butterchurn.createVisualizer(audioContext, canvas, {
                width: window.innerWidth,
                height: window.innerHeight,
                pixelRatio: window.devicePixelRatio || 1,
            });
            addLog(`✅ Visualizer erstellt (${window.innerWidth}x${window.innerHeight})`, 'success');
        } catch (e) {
            addLog(`❌ Visualizer Fehler: ${e.message}`, 'error');
        }

        // ----- Presets (nur die ersten zwei aus der Bibliothek) -----
        let presetKeys = [];
        let myPresets = [];
        try {
            const allPresets = butterchurnPresets.getPresets();
            presetKeys = Object.keys(allPresets);
            addLog(`📋 ${presetKeys.length} Presets verfügbar`, 'info');

            // Nimm das erste und das dritte (oder zweite) Preset
            const indices = [0, Math.min(2, presetKeys.length - 1)];
            myPresets = indices.map(i => allPresets[presetKeys[i]]);
            addLog(`🎨 2 Presets ausgewählt: "${presetKeys[indices[0]]}" und "${presetKeys[indices[1]]}"`, 'success');
        } catch (e) {
            addLog(`❌ Presets Fehler: ${e.message}`, 'error');
            // Fallback: minimale Presets
            myPresets = [
                { name: 'Default', shader: 'shaders/default.milk', params: {} },
                { name: 'Colorful', shader: 'shaders/default.milk', params: { wave_mode: 1 } }
            ];
            addLog('⚠️ Fallback-Presets verwendet', 'warn');
        }

        // ----- Preset-Logik -----
        let currentPresetIndex = 0;
        const presetLabel = document.getElementById('presetLabel');

        function loadPreset(index) {
            if (!visualizer || myPresets.length === 0) {
                addLog('⚠️ Visualizer oder Presets nicht verfügbar', 'warn');
                return;
            }
            const preset = myPresets[index];
            if (!preset) return;
            try {
                visualizer.loadPreset(preset, 4.0);
                const name = preset.name || `Preset ${index+1}`;
                presetLabel.textContent = `${name} (${index+1}/${myPresets.length})`;
                addLog(`🎨 Preset geladen: ${name}`, 'success');
            } catch (e) {
                addLog(`❌ Fehler beim Laden von Preset ${index}: ${e.message}`, 'error');
            }
        }

        // Lade erstes Preset
        if (myPresets.length > 0) {
            loadPreset(0);
        } else {
            addLog('⚠️ Keine Presets verfügbar', 'warn');
        }

        // ----- Audio-Logik -----
        let audioElement = null;
        let isPlaying = false;

        function loadAudioFile(file) {
            addLog(`📂 Lade Datei: ${file.name} (${(file.size/1024).toFixed(0)} KB)`, 'info');
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
                audioElement = null;
            }
            try {
                const url = URL.createObjectURL(file);
                audioElement = new Audio(url);
                const source = audioContext.createMediaElementSource(audioElement);
                const analyser = audioContext.createAnalyser();
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                visualizer.connectAudio(analyser);
                addLog('🔗 Audio mit Visualizer verbunden', 'success');

                // Automatisch abspielen
                audioElement.play().then(() => {
                    isPlaying = true;
                    document.getElementById('playBtn').textContent = '⏸️';
                    document.getElementById('songName').textContent = file.name.length > 20 ? file.name.slice(0, 17) + '…' : file.name;
                    addLog('▶️ Wiedergabe gestartet', 'success');
                }).catch(err => {
                    isPlaying = false;
                    document.getElementById('playBtn').textContent = '▶️';
                    addLog(`⚠️ Autoplay blockiert: ${err.message}`, 'warn');
                });
            } catch (e) {
                addLog(`❌ Fehler beim Laden der Audiodatei: ${e.message}`, 'error');
            }
        }

        // ----- Rendering-Schleife -----
        function render() {
            if (visualizer) {
                try {
                    visualizer.render();
                } catch (e) {
                    // Nur einmal loggen
                    if (!render._errorLogged) {
                        addLog(`❌ Render-Fehler: ${e.message}`, 'error');
                        render._errorLogged = true;
                    }
                }
            }
            requestAnimationFrame(render);
        }
        render();
        addLog('🔄 Rendering gestartet', 'info');

        // ----- Event-Listener -----
        // Datei-Upload
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        addLog('✅ AudioContext resumed', 'success');
                    });
                }
                loadAudioFile(file);
            }
            e.target.value = '';
        });

        // Play/Pause
        document.getElementById('playBtn').addEventListener('click', () => {
            if (!audioElement) {
                document.getElementById('fileInput').click();
                return;
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                audioElement.pause();
                document.getElementById('playBtn').textContent = '▶️';
                isPlaying = false;
                addLog('⏸️ Pause', 'info');
            } else {
                audioElement.play().then(() => {
                    document.getElementById('playBtn').textContent = '⏸️';
                    isPlaying = true;
                    addLog('▶️ Play', 'success');
                }).catch(err => {
                    addLog(`❌ Play fehlgeschlagen: ${err.message}`, 'error');
                });
            }
        });

        // Nächstes Preset
        document.getElementById('nextPresetBtn').addEventListener('click', () => {
            if (myPresets.length === 0) return;
            currentPresetIndex = (currentPresetIndex + 1) % myPresets.length;
            loadPreset(currentPresetIndex);
        });

        // Vorheriges Preset
        document.getElementById('prevPresetBtn').addEventListener('click', () => {
            if (myPresets.length === 0) return;
            currentPresetIndex = (currentPresetIndex - 1 + myPresets.length) % myPresets.length;
            loadPreset(currentPresetIndex);
        });

        // Lautstärke
        document.getElementById('volumeControl').addEventListener('input', (e) => {
            if (audioElement) {
                audioElement.volume = parseFloat(e.target.value);
            }
        });

        // Fenstergröße
        window.addEventListener('resize', () => {
            if (visualizer) {
                visualizer.setRendererSize(window.innerWidth, window.innerHeight);
                addLog(`📐 Größe angepasst: ${window.innerWidth}x${window.innerHeight}`, 'info');
            }
        });

        // Tastatur
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('playBtn').click();
            }
            if (e.key === 'ArrowRight') {
                document.getElementById('nextPresetBtn').click();
            }
            if (e.key === 'ArrowLeft') {
                document.getElementById('prevPresetBtn').click();
            }
        });

        addLog('✅ Alles bereit! Lade eine MP3-Datei.', 'success');
        addLog('🎮 Steuerung: Leertaste = Play/Pause, Pfeiltasten = Presets', 'info');
    </script>
</body>
</html>
