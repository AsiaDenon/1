<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            z-index: 10;
        }
        #controls button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        #controls button:hover { background: rgba(255,255,255,0.25); }
        #controls input[type="file"] { display: none; }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover { background: #5541d9; }
        #volumeControl { width: 60px; accent-color: #6c5ce7; }
        #songName {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        #debug {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0,255,0,0.2);
            max-width: 360px;
            max-height: 70%;
            overflow-y: auto;
            z-index: 20;
            line-height: 1.6;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #debug .error { color: #ff6b6b; }
        #debug .success { color: #51cf66; }
        #debug .info { color: #74c0fc; }
        #debug .warn { color: #fcc419; }
        #debug::-webkit-scrollbar { width: 4px; }
        #debug::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        #debug .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        #debug .header button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }
        #debug .header button:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        #logOutput { display: block; word-wrap: break-word; }

        @media (max-width: 700px) {
            #debug {
                top: 10px;
                right: 10px;
                font-size: 10px;
                padding: 8px 12px;
                max-width: 200px;
                max-height: 50%;
            }
            #controls { padding: 8px 12px; gap: 6px; }
            .file-label { font-size: 11px; padding: 5px 12px; }
            #songName { max-width: 80px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="visualizer-canvas"></canvas>

        <div id="debug">
            <div class="header">
                <b>🐞 Debug-Log</b>
                <button id="copyDebugBtn" title="Log kopieren">📋 Kopieren</button>
            </div>
            <span id="logOutput">Lade Bibliotheken ...</span>
        </div>

        <div id="controls">
            <button id="playBtn" title="Play/Pause">⏸️</button>
            <label class="file-label" for="fileInput">📂 MP3 laden</label>
            <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
            <button id="nextPresetBtn" title="Nächstes Preset">🎨</button>
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
            <span id="songName">Keine Datei</span>
        </div>
    </div>

    <script type="module">
        // ----- Debug-Logger -----
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            if (logs.length > 100) logs.shift();
            renderLog();
            console.log(`[${type}]`, message);
        }

        function renderLog() {
            const output = document.getElementById('logOutput');
            if (!output) return;
            const icons = { error: '❌', success: '✅', warn: '⚠️', info: 'ℹ️' };
            const html = logs.map(log =>
                `<span class="${log.type}">${icons[log.type] || 'ℹ️'} [${log.timestamp}] ${log.message}</span>`
            ).join('<br />');
            output.innerHTML = html;
            const debugEl = document.getElementById('debug');
            if (debugEl) debugEl.scrollTop = debugEl.scrollHeight;
        }

        document.getElementById('copyDebugBtn').addEventListener('click', async function() {
            const text = logs.map(l => `[${l.timestamp}] ${l.type.toUpperCase()}: ${l.message}`).join('\n');
            try {
                await navigator.clipboard.writeText(text);
                const orig = this.textContent;
                this.textContent = '✅ Kopiert!';
                setTimeout(() => { this.textContent = orig; }, 2000);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Kopiert!');
            }
        });

        addLog('🚀 Seite geladen', 'info');

        // ----- DOM -----
        const canvas = document.getElementById('visualizer-canvas');
        const container = document.getElementById('container');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const volumeControl = document.getElementById('volumeControl');
        const songName = document.getElementById('songName');
        const nextPresetBtn = document.getElementById('nextPresetBtn');

        // ----- Globale Variablen -----
        let audioContext = null;
        let visualizer = null;
        let currentSourceNode = null;
        let currentAnalyser = null;
        let currentAudioElement = null;
        let isPlaying = false;
        let presetKeys = [];
        let presetsData = null;
        let isReady = false;

        // ----- Butterchurn per ESM laden (funktioniert!) -----
        async function loadButterchurn() {
            try {
                addLog('⏳ Lade butterchurn per ESM...', 'info');
                const module = await import('https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/+esm');
                const bc = module.default || module;
                addLog('✅ butterchurn geladen', 'success');
                return bc;
            } catch (err) {
                addLog(`❌ butterchurn ESM fehlgeschlagen: ${err.message}`, 'error');
                // Fallback: versuche unpkg
                try {
                    addLog('⏳ Versuche alternativen CDN (unpkg)...', 'warn');
                    const module2 = await import('https://unpkg.com/butterchurn@2.6.7/+esm');
                    const bc2 = module2.default || module2;
                    addLog('✅ butterchurn (unpkg) geladen', 'success');
                    return bc2;
                } catch (err2) {
                    addLog(`❌ Auch unpkg fehlgeschlagen: ${err2.message}`, 'error');
                    return null;
                }
            }
        }

        // ----- Presets von GitHub laden (als JSON) -----
        async function loadPresets() {
            try {
                addLog('⏳ Lade Presets von GitHub...', 'info');
                const response = await fetch('https://raw.githubusercontent.com/jberg/butterchurn-presets/master/presets.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                addLog(`✅ ${Object.keys(data).length} Presets geladen`, 'success');
                return data;
            } catch (e) {
                addLog(`⚠️ Presets von GitHub fehlgeschlagen: ${e.message}`, 'warn');
                // Fallback: minimales Preset
                return {
                    'Default': {
                        "shader": "shaders/default.milk",
                        "params": {}
                    }
                };
            }
        }

        // ----- Initialisierung -----
        async function init() {
            const bc = await loadButterchurn();
            if (!bc) {
                addLog('❌ Butterchurn konnte nicht geladen werden – bitte Seite neu laden', 'error');
                return;
            }

            const presets = await loadPresets();
            presetsData = presets;
            presetKeys = Object.keys(presetsData);

            try {
                audioContext = new(window.AudioContext || window.webkitAudioContext)();
                addLog(`✅ AudioContext erstellt (${audioContext.state})`, 'success');

                const width = container.clientWidth;
                const height = container.clientHeight;

                visualizer = bc.createVisualizer(audioContext, canvas, {
                    width: width,
                    height: height,
                    pixelRatio: window.devicePixelRatio || 1,
                });
                addLog(`✅ Visualizer erstellt (${width}x${height})`, 'success');

                // Erstes Preset laden
                if (presetKeys.length > 0) {
                    visualizer.loadPreset(presetsData[presetKeys[0]], 0.0);
                    addLog(`🎨 Preset: ${presetKeys[0].slice(0, 40)}...`, 'info');
                }

                isReady = true;
                renderLoop();
                addLog('✅ Bereit! Lade eine MP3-Datei.', 'success');

            } catch (e) {
                addLog(`❌ Fehler beim Erstellen des Visualizers: ${e.message}`, 'error');
                console.error(e);
            }
        }

        function renderLoop() {
            if (visualizer) {
                try { visualizer.render(); } catch (e) {}
            }
            requestAnimationFrame(renderLoop);
        }

        function loadRandomPreset() {
            if (!visualizer || presetKeys.length === 0) return;
            const idx = Math.floor(Math.random() * presetKeys.length);
            const key = presetKeys[idx];
            visualizer.loadPreset(presetsData[key], 0.0);
            addLog(`🎨 Preset: ${key.slice(0, 40)}...`, 'info');
        }

        // ----- Datei auswählen -----
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) {
                addLog('⚠️ Keine Datei', 'warn');
                return;
            }

            const displayName = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
            songName.textContent = displayName;
            addLog(`📂 Datei: ${file.name} (${(file.size/1024).toFixed(0)} KB)`, 'info');

            if (!isReady) {
                addLog('⚠️ Visualizer noch nicht bereit – warte...', 'warn');
                if (!audioContext) {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                }
            }

            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume().catch(e => addLog(`❌ Resume fehlgeschlagen: ${e.message}`, 'error'));
            }

            try {
                if (currentSourceNode) { currentSourceNode.disconnect();
                    currentSourceNode = null; }
                if (currentAudioElement) {
                    currentAudioElement.pause();
                    currentAudioElement.src = '';
                    currentAudioElement = null;
                }

                const audioElement = new Audio();
                const objectUrl = URL.createObjectURL(file);
                audioElement.src = objectUrl;
                audioElement.loop = false;
                audioElement.volume = volumeControl.value;

                if (!audioContext) {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                }

                const source = audioContext.createMediaElementSource(audioElement);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;

                source.connect(analyser);
                analyser.connect(audioContext.destination);

                if (visualizer) {
                    visualizer.connectAudio(analyser);
                    addLog('🔗 Audio mit Visualizer verbunden', 'success');
                } else {
                    addLog('⚠️ Visualizer nicht bereit – nur Audio', 'warn');
                }

                currentSourceNode = source;
                currentAnalyser = analyser;
                currentAudioElement = audioElement;

                audioElement.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                    addLog('✅ Wiedergabe gestartet 🎵', 'success');
                }).catch(err => {
                    addLog(`⚠️ Autoplay blockiert: ${err.message}`, 'warn');
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                });

                fileInput.value = '';

            } catch (error) {
                addLog(`❌ Fehler: ${error.message}`, 'error');
                console.error(error);
                songName.textContent = '❌ Fehler';
            }
        }

        // ----- Event-Listener -----
        fileInput.addEventListener('change', handleFileSelect);

        playBtn.addEventListener('click', function() {
            if (!currentAudioElement) { fileInput.click(); return; }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                currentAudioElement.pause();
                playBtn.textContent = '▶️';
                isPlaying = false;
                addLog('⏸️ Pause', 'info');
            } else {
                currentAudioElement.play().then(() => {
                    playBtn.textContent = '⏸️';
                    isPlaying = true;
                    addLog('▶️ Wiedergabe', 'success');
                }).catch(err => {
                    addLog(`❌ Play fehlgeschlagen: ${err.message}`, 'error');
                });
            }
        });

        nextPresetBtn.addEventListener('click', function() {
            if (isReady) loadRandomPreset();
            else addLog('⚠️ Visualizer nicht bereit', 'warn');
        });

        volumeControl.addEventListener('input', function() {
            if (currentAudioElement) currentAudioElement.volume = volumeControl.value;
        });

        window.addEventListener('resize', function() {
            if (visualizer) {
                visualizer.setRendererSize(container.clientWidth, container.clientHeight);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault();
                playBtn.click(); }
        });

        // ----- Start -----
        init();
        addLog('💡 Wähle eine MP3-Datei', 'info');
    </script>
</body>
</html>
