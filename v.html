<script type="module">
    // ----- DEBUG-LOGGER (unverändert) -----
    const logs = [];
    function addLog(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        logs.push({ message, type, timestamp });
        if (logs.length > 80) logs.shift();
        renderLog();
        console.log(`[${type}]`, message);
    }
    function renderLog() {
        const output = document.getElementById('logOutput');
        if (!output) return;
        const icons = { error: '❌', success: '✅', warn: '⚠️', info: 'ℹ️' };
        const html = logs.map(log =>
            `<span class="${log.type}">${icons[log.type] || 'ℹ️'} [${log.timestamp}] ${log.message}</span>`
        ).join('<br />');
        output.innerHTML = html;
        const debugEl = document.getElementById('debug');
        if (debugEl) debugEl.scrollTop = debugEl.scrollHeight;
    }
    document.getElementById('copyDebugBtn').addEventListener('click', function() {
        const text = logs.map(l => `[${l.timestamp}] ${l.type.toUpperCase()}: ${l.message}`).join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = this.textContent;
                this.textContent = '✅';
                setTimeout(() => { this.textContent = orig; }, 1500);
            }).catch(() => fallbackCopy(text, this));
        } else {
            fallbackCopy(text, this);
        }
    });
    function fallbackCopy(text, button) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            const orig = button.textContent;
            button.textContent = '✅';
            setTimeout(() => { button.textContent = orig; }, 1500);
        } catch (e) {
            alert('Log kopieren fehlgeschlagen:\n\n' + text);
        }
        document.body.removeChild(ta);
    }

    addLog('🚀 Seite geladen', 'info');

    // ============================================================
    // 1. BUTTERCHURN LADEN (ESM)
    // ============================================================
    addLog('⏳ Lade Butterchurn...', 'info');
    let butterchurn;
    try {
        const module = await import('butterchurn');
        butterchurn = module.default || module;
        if (butterchurn && typeof butterchurn === 'object' && butterchurn.default) {
            butterchurn = butterchurn.default;
        }
        if (typeof butterchurn.createVisualizer !== 'function') {
            throw new Error('createVisualizer ist keine Funktion');
        }
        addLog('✅ Butterchurn geladen', 'success');
    } catch (e) {
        addLog(`❌ Butterchurn Fehler: ${e.message}`, 'error');
        throw e;
    }

    // ============================================================
    // 2. PRESETS LADEN – jetzt als ES-Modul
    // ============================================================
    addLog('⏳ Lade Presets (ESM)...', 'info');
    let myPresets = [];
    let myPresetKeys = [];

    try {
        // Dynamischer Import der Preset-Bibliothek als ES-Modul
        const presetsModule = await import('https://cdn.jsdelivr.net/npm/butterchurn-presets@2.6.7/+esm');
        const getPresets = presetsModule.getPresets || presetsModule.default?.getPresets;
        if (typeof getPresets !== 'function') {
            throw new Error('getPresets nicht gefunden');
        }
        const allPresets = getPresets();
        const keys = Object.keys(allPresets);
        if (keys.length === 0) throw new Error('Keine Presets im Objekt');

        // Nimm die ersten 2 Presets (oder mehr, wenn du möchtest)
        const selectedKeys = keys.slice(0, 2);
        myPresets = selectedKeys.map(key => allPresets[key]);
        myPresetKeys = selectedKeys;
        addLog(`✅ ${myPresets.length} Presets geladen`, 'success');
        addLog(`🎨 "${myPresetKeys[0]}" und "${myPresetKeys[1]}"`, 'success');
    } catch (e) {
        // Fallback: Versuche UMD (falls das ESM fehlschlägt)
        addLog(`⚠️ ESM-Presets fehlgeschlagen: ${e.message}`, 'warn');
        addLog('⏳ Versuche UMD-Presets...', 'info');
        const presetsLib = await new Promise(resolve => {
            if (typeof window.butterchurnPresets !== 'undefined') {
                resolve(window.butterchurnPresets);
                return;
            }
            const check = setInterval(() => {
                if (typeof window.butterchurnPresets !== 'undefined') {
                    clearInterval(check);
                    resolve(window.butterchurnPresets);
                }
            }, 100);
            setTimeout(() => {
                clearInterval(check);
                resolve(null);
            }, 3000);
        });

        if (presetsLib && typeof presetsLib.getPresets === 'function') {
            try {
                const allPresets = presetsLib.getPresets();
                const keys = Object.keys(allPresets);
                if (keys.length > 0) {
                    const selectedKeys = keys.slice(0, 2);
                    myPresets = selectedKeys.map(key => allPresets[key]);
                    myPresetKeys = selectedKeys;
                    addLog(`✅ ${myPresets.length} Presets von UMD geladen`, 'success');
                }
            } catch (err) {
                addLog(`❌ UMD-Presets Fehler: ${err.message}`, 'error');
            }
        }

        if (myPresets.length === 0) {
            addLog('❌ Keine Presets verfügbar – Preset-Funktion deaktiviert.', 'error');
            // Buttons deaktivieren
            document.getElementById('nextPresetBtn').disabled = true;
            document.getElementById('prevPresetBtn').disabled = true;
        }
    }

    // ============================================================
    // 3. VISUALIZER ERSTELLEN
    // ============================================================
    const container = document.getElementById('visualizer-container');
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);

    // AudioContext erst nach Nutzerinteraktion erstellen
    let audioContext;
    function initAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            addLog(`🔊 AudioContext erstellt (${audioContext.state})`, 'success');
        }
        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }
    }

    let visualizer;
    try {
        // AudioContext wird hier noch nicht benötigt? Butterchurn braucht ihn aber.
        // Deshalb vorher initAudioContext() aufrufen.
        if (!audioContext) initAudioContext();
        visualizer = butterchurn.createVisualizer(audioContext, canvas, {
            width: window.innerWidth,
            height: window.innerHeight,
            pixelRatio: window.devicePixelRatio || 1,
        });
        addLog(`✅ Visualizer erstellt (${window.innerWidth}x${window.innerHeight})`, 'success');
    } catch (e) {
        addLog(`❌ Visualizer Fehler: ${e.message}`, 'error');
        throw e;
    }

    // ============================================================
    // 4. PRESET-LOGIK
    // ============================================================
    let currentPresetIndex = 0;
    const presetLabel = document.getElementById('presetLabel');

    function loadPreset(index) {
        if (!visualizer || myPresets.length === 0) {
            addLog('⚠️ Keine Presets verfügbar', 'warn');
            return;
        }
        const preset = myPresets[index];
        if (!preset) {
            addLog(`⚠️ Preset ${index} nicht gefunden`, 'warn');
            return;
        }
        try {
            const name = myPresetKeys[index] || `Preset ${index+1}`;
            visualizer.loadPreset(preset, 4.0);
            presetLabel.textContent = `${name} (${index+1}/${myPresets.length})`;
            addLog(`🎨 Preset geladen: ${name}`, 'success');
        } catch (e) {
            addLog(`❌ Preset-Fehler: ${e.message}`, 'error');
        }
    }

    if (myPresets.length > 0) {
        loadPreset(0);
    } else {
        presetLabel.textContent = 'Keine Presets';
    }

    // ============================================================
    // 5. AUDIO-LOGIK
    // ============================================================
    let audioElement = null;
    let isPlaying = false;

    function loadAudioFile(file) {
        addLog(`📂 Lade: ${file.name} (${(file.size/1024).toFixed(0)} KB)`, 'info');
        
        if (audioElement) {
            audioElement.pause();
            audioElement.src = '';
            audioElement = null;
        }
        
        try {
            initAudioContext(); // stellt sicher, dass AudioContext aktiv ist
            const url = URL.createObjectURL(file);
            audioElement = new Audio(url);
            
            const source = audioContext.createMediaElementSource(audioElement);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            
            if (visualizer) {
                visualizer.connectAudio(analyser);
                addLog('🔗 Audio mit Visualizer verbunden', 'success');
            } else {
                addLog('⚠️ Visualizer nicht bereit', 'warn');
            }

            audioElement.play().then(() => {
                isPlaying = true;
                document.getElementById('playBtn').textContent = '⏸️';
                document.getElementById('songName').textContent = file.name.length > 20 ? file.name.slice(0, 17) + '…' : file.name;
                addLog('▶️ Wiedergabe gestartet', 'success');
            }).catch(err => {
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶️';
                addLog(`⚠️ Autoplay blockiert: ${err.message}`, 'warn');
            });
        } catch (e) {
            addLog(`❌ Audio-Fehler: ${e.message}`, 'error');
        }
    }

    // ============================================================
    // 6. RENDERING
    // ============================================================
    function render() {
        if (visualizer) {
            try {
                visualizer.render();
            } catch (e) {
                if (!render._errorLogged) {
                    addLog(`❌ Render-Fehler: ${e.message}`, 'error');
                    render._errorLogged = true;
                }
            }
        }
        requestAnimationFrame(render);
    }
    render();
    addLog('🔄 Rendering gestartet', 'info');

    // ============================================================
    // 7. EVENT-LISTENER
    // ============================================================
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            loadAudioFile(file);
        }
        e.target.value = '';
    });

    document.getElementById('playBtn').addEventListener('click', () => {
        if (!audioElement) {
            document.getElementById('fileInput').click();
            return;
        }
        initAudioContext();
        
        if (isPlaying) {
            audioElement.pause();
            document.getElementById('playBtn').textContent = '▶️';
            isPlaying = false;
            addLog('⏸️ Pause', 'info');
        } else {
            audioElement.play().then(() => {
                document.getElementById('playBtn').textContent = '⏸️';
                isPlaying = true;
                addLog('▶️ Play', 'success');
            }).catch(err => addLog(`❌ Play: ${err.message}`, 'error'));
        }
    });

    document.getElementById('nextPresetBtn').addEventListener('click', () => {
        if (myPresets.length === 0) return;
        currentPresetIndex = (currentPresetIndex + 1) % myPresets.length;
        loadPreset(currentPresetIndex);
    });

    document.getElementById('prevPresetBtn').addEventListener('click', () => {
        if (myPresets.length === 0) return;
        currentPresetIndex = (currentPresetIndex - 1 + myPresets.length) % myPresets.length;
        loadPreset(currentPresetIndex);
    });

    document.getElementById('volumeControl').addEventListener('input', (e) => {
        if (audioElement) audioElement.volume = parseFloat(e.target.value);
    });

    window.addEventListener('resize', () => {
        if (visualizer) {
            visualizer.setRendererSize(window.innerWidth, window.innerHeight);
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') { e.preventDefault();
            document.getElementById('playBtn').click(); }
        if (e.key === 'ArrowRight') { document.getElementById('nextPresetBtn').click(); }
        if (e.key === 'ArrowLeft') { document.getElementById('prevPresetBtn').click(); }
    });

    addLog('✅ Alles bereit! Lade eine MP3-Datei.', 'success');
    addLog('🎮 Leertaste = Play/Pause, Pfeiltasten = Presets', 'info');
</script>
