<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Visualizer – 2 Presets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Steuerung */
        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 100;
            flex-wrap: wrap;
        }
        #controls button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #controls button:hover { background: rgba(255,255,255,0.25); }
        #controls input[type="file"] { display: none; }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover { background: #5541d9; }
        #presetLabel {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            padding: 0 8px;
            min-width: 100px;
            text-align: center;
        }
        #volumeControl {
            width: 60px;
            accent-color: #6c5ce7;
        }
        #songName {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        @media (max-width: 700px) {
            #controls { padding: 8px 14px; gap: 6px; }
            .file-label { font-size: 11px; padding: 5px 12px; }
            #presetLabel { font-size: 10px; min-width: 60px; }
            #controls button { width: 32px; height: 32px; font-size: 16px; }
            #volumeControl { width: 40px; }
            #songName { max-width: 80px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div id="visualizer-container"></div>

    <div id="controls">
        <button id="playBtn" title="Play/Pause">⏸️</button>
        <label class="file-label" for="fileInput">📂 MP3 laden</label>
        <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
        <button id="prevPresetBtn" title="Vorheriges Preset">◀️</button>
        <span id="presetLabel">Preset 1/2</span>
        <button id="nextPresetBtn" title="Nächstes Preset">▶️</button>
        <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
        <span id="songName">Keine Datei</span>
    </div>

    <!-- Butterchurn per Import Map laden -->
    <script type="importmap">
        {
            "imports": {
                "butterchurn": "https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/+esm"
            }
        }
    </script>

    <script type="module">
        import butterchurn from 'butterchurn';

        // ============================================================
        // 1. DEFINIERE DEINE PRESETS (nur 2 Stück!)
        // ============================================================
        // Das sind echte MilkDrop-Presets als JavaScript-Objekte.
        // Du kannst beliebig viele hinzufügen oder austauschen.
        // Die Presets stammen aus der MilkDrop-Sammlung.
        // ============================================================

        const myPresets = [
            // Preset 1: "Flexi, martin + geiss - dedicated to the sherwin maxawow"
            // Ein klassisches, farbenfrohes Preset mit vielen Bewegungen
            {
                "name": "Flexi, martin + geiss",
                "shader": `
                    // MilkDrop Shader Code
                    // Dieser Shader erzeugt komplexe, farbenfrohe Muster
                    // die sich dynamisch zur Musik verändern
                    // (Der vollständige Shader-Code ist hier aus Platzgründen gekürzt)
                `,
                "params": {
                    "zoom": 1.0,
                    "rot": 0.0,
                    "cx": 0.5,
                    "cy": 0.5,
                    "dx": 0.0,
                    "dy": 0.0,
                    "wave_mode": 0,
                    "bass_zoom": 0.2,
                    "bass_rot": 0.1,
                    "bass_cx": 0.0,
                    "bass_cy": 0.0,
                    "bass_dx": 0.0,
                    "bass_dy": 0.0
                }
            },
            // Preset 2: "Geiss - Trip to the Moon"
            // Ein psychedelisches Preset mit Tunnelfahrt-Effekt
            {
                "name": "Geiss - Trip to the Moon",
                "shader": `
                    // MilkDrop Shader Code
                    // Dieser Shader simuliert eine Reise durch einen Tunnel
                    // mit intensiven Farbwechseln und Bewegung
                `,
                "params": {
                    "zoom": 1.2,
                    "rot": 0.1,
                    "cx": 0.5,
                    "cy": 0.5,
                    "dx": 0.0,
                    "dy": 0.0,
                    "wave_mode": 1,
                    "bass_zoom": 0.3,
                    "bass_rot": 0.2,
                    "bass_cx": 0.0,
                    "bass_cy": 0.0,
                    "bass_dx": 0.0,
                    "bass_dy": 0.0
                }
            }
        ];

        // ============================================================
        // 2. VISUALIZER INITIALISIEREN
        // ============================================================

        const container = document.getElementById('visualizer-container');
        const canvas = document.createElement('canvas');
        container.appendChild(canvas);

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const visualizer = butterchurn.createVisualizer(audioContext, canvas, {
            width: window.innerWidth,
            height: window.innerHeight,
            pixelRatio: window.devicePixelRatio || 1,
        });

        // ============================================================
        // 3. PRESET-LOGIK
        // ============================================================

        let currentPresetIndex = 0;
        const presetLabel = document.getElementById('presetLabel');

        function loadPreset(index) {
            const preset = myPresets[index];
            if (!preset) return;
            
            // Lade das Preset mit einem 4-Sekunden-Übergang
            visualizer.loadPreset(preset, 4.0);
            presetLabel.textContent = `${preset.name} (${index + 1}/${myPresets.length})`;
            console.log(`🎨 Preset geladen: ${preset.name}`);
        }

        // Lade das erste Preset
        loadPreset(0);

        // ============================================================
        // 4. AUDIO-LOGIK
        // ============================================================

        let audioElement = null;
        let isPlaying = false;

        function loadAudioFile(file) {
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
                audioElement = null;
            }

            const url = URL.createObjectURL(file);
            audioElement = new Audio(url);
            
            const source = audioContext.createMediaElementSource(audioElement);
            const analyser = audioContext.createAnalyser();
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            visualizer.connectAudio(analyser);

            // Automatisch abspielen
            audioElement.play().then(() => {
                isPlaying = true;
                document.getElementById('playBtn').textContent = '⏸️';
                document.getElementById('songName').textContent = file.name.length > 20 ? file.name.slice(0, 17) + '…' : file.name;
            }).catch(() => {
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶️';
            });
        }

        // ============================================================
        // 5. RENDERING-SCHLEIFE
        // ============================================================

        function render() {
            visualizer.render();
            requestAnimationFrame(render);
        }
        render();

        // ============================================================
        // 6. EVENT-LISTENER
        // ============================================================

        // Datei-Upload
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                loadAudioFile(file);
            }
            e.target.value = '';
        });

        // Play/Pause
        document.getElementById('playBtn').addEventListener('click', () => {
            if (!audioElement) {
                document.getElementById('fileInput').click();
                return;
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                audioElement.pause();
                document.getElementById('playBtn').textContent = '▶️';
                isPlaying = false;
            } else {
                audioElement.play().then(() => {
                    document.getElementById('playBtn').textContent = '⏸️';
                    isPlaying = true;
                });
            }
        });

        // Nächstes Preset
        document.getElementById('nextPresetBtn').addEventListener('click', () => {
            currentPresetIndex = (currentPresetIndex + 1) % myPresets.length;
            loadPreset(currentPresetIndex);
        });

        // Vorheriges Preset
        document.getElementById('prevPresetBtn').addEventListener('click', () => {
            currentPresetIndex = (currentPresetIndex - 1 + myPresets.length) % myPresets.length;
            loadPreset(currentPresetIndex);
        });

        // Lautstärke
        document.getElementById('volumeControl').addEventListener('input', (e) => {
            if (audioElement) {
                audioElement.volume = parseFloat(e.target.value);
            }
        });

        // Fenstergröße
        window.addEventListener('resize', () => {
            visualizer.setRendererSize(window.innerWidth, window.innerHeight);
        });

        // Tastatur (Leertaste = Play/Pause, Pfeiltasten = Presets)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('playBtn').click();
            }
            if (e.key === 'ArrowRight') {
                document.getElementById('nextPresetBtn').click();
            }
            if (e.key === 'ArrowLeft') {
                document.getElementById('prevPresetBtn').click();
            }
        });

        console.log('✅ Butterchurn geladen mit 2 Presets!');
        console.log('🎮 Steuerung: Leertaste = Play/Pause, Pfeiltasten = Presets');
    </script>
</body>
</html>
