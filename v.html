<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn MP3 Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            margin: 0 auto;
            width: fit-content;
            max-width: 92%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
        }
        #controls button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        #controls input[type="file"] {
            display: none;
        }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            white-space: nowrap;
        }
        .file-label:hover {
            background: #5541d9;
        }
        #volumeControl {
            width: 70px;
            accent-color: #6c5ce7;
            cursor: pointer;
        }
        #songName {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 60px;
            text-align: center;
        }
        @media (max-width: 600px) {
            #controls { gap: 8px; padding: 10px 14px; }
            .file-label { font-size: 12px; padding: 6px 12px; }
            #volumeControl { width: 50px; }
            #songName { max-width: 100px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="visualizer-canvas"></canvas>

        <div id="controls">
            <button id="playBtn" title="Play / Pause">⏸️</button>
            <label class="file-label" for="fileInput">📂 MP3 laden</label>
            <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
            <button id="nextPresetBtn" title="Nächstes Preset">🎨</button>
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
            <span id="songName">Keine Datei</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "butterchurn": "https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/+esm",
                "butterchurn-presets": "https://cdn.jsdelivr.net/npm/butterchurn-presets@2.6.7/+esm"
            }
        }
    </script>

    <script type="module">
        import butterchurn from 'butterchurn';
        import butterchurnPresets from 'butterchurn-presets';

        // ----- DOM -----
        const canvas = document.getElementById('visualizer-canvas');
        const container = document.getElementById('container');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const volumeControl = document.getElementById('volumeControl');
        const songName = document.getElementById('songName');
        const nextPresetBtn = document.getElementById('nextPresetBtn');

        // ----- AudioContext & Visualizer -----
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const width = container.clientWidth;
        const height = container.clientHeight;
        const visualizer = butterchurn.createVisualizer(audioContext, canvas, {
            width: width,
            height: height,
            pixelRatio: window.devicePixelRatio || 1,
        });

        // ----- Presets laden -----
        const presets = butterchurnPresets.getPresets();
        const presetKeys = Object.keys(presets);
        let currentPresetIndex = 0;

        function loadRandomPreset() {
            if (presetKeys.length === 0) return;
            const idx = Math.floor(Math.random() * presetKeys.length);
            visualizer.loadPreset(presets[presetKeys[idx]], 0.0);
            currentPresetIndex = idx;
            console.log('Preset geladen:', presetKeys[idx]);
        }
        loadRandomPreset();

        // ----- Zustand -----
        let currentSourceNode = null;
        let currentAnalyser = null;
        let currentAudioElement = null;
        let isPlaying = false;

        // ----- Datei auswählen -----
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) {
                songName.textContent = '❌ Keine Datei';
                return;
            }

            // Sofort Dateinamen anzeigen
            const displayName = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
            songName.textContent = displayName;
            console.log('Datei ausgewählt:', file.name);

            // Alte Verbindungen trennen
            if (currentSourceNode) {
                currentSourceNode.disconnect();
                currentSourceNode = null;
            }
            if (currentAudioElement) {
                currentAudioElement.pause();
                currentAudioElement.src = '';
                currentAudioElement = null;
            }

            try {
                // Audio-Element erstellen
                const audioElement = new Audio();
                const objectUrl = URL.createObjectURL(file);
                audioElement.src = objectUrl;
                audioElement.loop = false;
                audioElement.volume = volumeControl.value;

                // AudioContext starten (falls nötig)
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        console.log('AudioContext resumed');
                    }).catch(err => {
                        console.warn('Resume fehlgeschlagen:', err);
                    });
                }

                // MediaElementSource & Analyser
                const source = audioContext.createMediaElementSource(audioElement);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;

                source.connect(analyser);
                analyser.connect(audioContext.destination);
                visualizer.connectAudio(analyser);

                currentSourceNode = source;
                currentAnalyser = analyser;
                currentAudioElement = audioElement;

                // Automatisch abspielen
                audioElement.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                    console.log('▶️ Wiedergabe gestartet');
                }).catch(err => {
                    console.warn('Autoplay blockiert:', err);
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                    songName.textContent = '⚠️ ' + displayName + ' (klicke Play)';
                });

                // Datei-Input zurücksetzen
                fileInput.value = '';

            } catch (error) {
                console.error('Fehler beim Laden der Datei:', error);
                songName.textContent = '❌ Fehler: ' + error.message;
            }
        });

        // ----- Play / Pause -----
        playBtn.addEventListener('click', () => {
            if (!currentAudioElement) {
                fileInput.click();
                return;
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (isPlaying) {
                currentAudioElement.pause();
                playBtn.textContent = '▶️';
                isPlaying = false;
            } else {
                currentAudioElement.play().catch(() => {});
                playBtn.textContent = '⏸️';
                isPlaying = true;
            }
        });

        // ----- Nächstes Preset -----
        nextPresetBtn.addEventListener('click', () => {
            loadRandomPreset();
        });

        // ----- Lautstärke -----
        volumeControl.addEventListener('input', () => {
            if (currentAudioElement) {
                currentAudioElement.volume = volumeControl.value;
            }
        });

        // ----- Größenänderung -----
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            visualizer.setRendererSize(w, h);
        });

        // ----- Rendering-Schleife -----
        function render() {
            visualizer.render();
            requestAnimationFrame(render);
        }
        render();

        // ----- Tastatur (Leertaste) -----
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                playBtn.click();
            }
        });

        console.log('✅ Bereit – lade eine MP3-Datei hoch.');
    </script>
</body>
</html>
