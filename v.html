<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizer – 11 coole Modi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            z-index: 10;
        }
        #controls button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #controls button:hover { background: rgba(255,255,255,0.25); }
        #controls input[type="file"] { display: none; }
        .file-label {
            background: #6c5ce7;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-label:hover { background: #5541d9; }
        #volumeControl { width: 50px; accent-color: #6c5ce7; }
        #songName {
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 40px;
            text-align: center;
        }
        #modeLabel {
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            padding: 0 4px;
            min-width: 50px;
            text-align: center;
        }

        #debug {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0,255,0,0.2);
            max-width: 320px;
            max-height: 60%;
            overflow-y: auto;
            z-index: 20;
            line-height: 1.5;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #debug .error { color: #ff6b6b; }
        #debug .success { color: #51cf66; }
        #debug .info { color: #74c0fc; }
        #debug .warn { color: #fcc419; }
        #debug::-webkit-scrollbar { width: 4px; }
        #debug::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        #debug .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        #debug .header button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }
        #debug .header button:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        #logOutput { display: block; word-wrap: break-word; }

        @media (max-width: 700px) {
            #debug {
                top: 8px;
                right: 8px;
                font-size: 9px;
                padding: 6px 10px;
                max-width: 160px;
                max-height: 40%;
            }
            #controls { padding: 6px 10px; gap: 4px; }
            .file-label { font-size: 10px; padding: 4px 10px; }
            #songName { max-width: 60px; font-size: 10px; }
            #modeLabel { font-size: 9px; min-width: 30px; }
            #controls button { width: 28px; height: 28px; font-size: 13px; }
            #volumeControl { width: 40px; }
        }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="visualizer-canvas"></canvas>

        <div id="debug">
            <div class="header">
                <b>🐞 Debug</b>
                <button id="copyDebugBtn">📋 Kopieren</button>
            </div>
            <span id="logOutput">Lade ...</span>
        </div>

        <div id="controls">
            <button id="playBtn" title="Play/Pause">⏸️</button>
            <label class="file-label" for="fileInput">📂 MP3</label>
            <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" />
            <button id="modeBtn" title="Modus wechseln">🔄</button>
            <span id="modeLabel">Balken</span>
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" />
            <span id="songName">Keine</span>
        </div>
    </div>

    <script>
        // ----- Debug-Logger -----
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            if (logs.length > 80) logs.shift();
            renderLog();
            console.log(`[${type}]`, message);
        }

        function renderLog() {
            const output = document.getElementById('logOutput');
            if (!output) return;
            const icons = { error: '❌', success: '✅', warn: '⚠️', info: 'ℹ️' };
            const html = logs.map(log =>
                `<span class="${log.type}">${icons[log.type] || 'ℹ️'} [${log.timestamp}] ${log.message}</span>`
            ).join('<br />');
            output.innerHTML = html;
            const debugEl = document.getElementById('debug');
            if (debugEl) debugEl.scrollTop = debugEl.scrollHeight;
        }

        document.getElementById('copyDebugBtn').addEventListener('click', async function() {
            const text = logs.map(l => `[${l.timestamp}] ${l.type.toUpperCase()}: ${l.message}`).join('\n');
            try {
                await navigator.clipboard.writeText(text);
                const orig = this.textContent;
                this.textContent = '✅';
                setTimeout(() => { this.textContent = orig; }, 1500);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Kopiert!');
            }
        });

        addLog('🚀 Seite geladen', 'info');

        // ----- DOM -----
        const canvas = document.getElementById('visualizer-canvas');
        const container = document.getElementById('container');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const volumeControl = document.getElementById('volumeControl');
        const songName = document.getElementById('songName');
        const modeBtn = document.getElementById('modeBtn');
        const modeLabel = document.getElementById('modeLabel');

        // ----- Audio-Variablen -----
        let audioContext = null;
        let currentSourceNode = null;
        let currentAnalyser = null;
        let currentAudioElement = null;
        let isPlaying = false;
        let animationId = null;

        // ----- Alle 11 Visualisierungsmodi -----
        const MODES = [
            'balken', 'wellen', 'kreis', 'feuerwerk', 'lissajous', 'wirbel',
            'nebel', 'partikel', 'torus', 'blitze', 'regenbogen'
        ];
        const MODE_NAMES = {
            balken: '📊 Balken',
            wellen: '🌊 Wellen',
            kreis: '⭕ Kreis',
            feuerwerk: '🎆 Feuerwerk',
            lissajous: '💫 Lissajous',
            wirbel: '🌀 Wirbel',
            nebel: '🌌 Nebel',
            partikel: '✨ Partikel',
            torus: '🌀 3D-Torus',
            blitze: '⚡ Blitze',
            regenbogen: '🌈 Regenbogen'
        };
        let currentModeIndex = 0;
        let mode = MODES[0];

        // ----- Canvas-Größe -----
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * (window.devicePixelRatio || 1);
            canvas.height = rect.height * (window.devicePixelRatio || 1);
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
        }

        // ============================================================
        // 1. BARKEN
        // ============================================================
        function drawBars(dataArray, ctx, w, h) {
            const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/1.5);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            const bufferLength = dataArray.length;
            const barWidth = (w / bufferLength) * 2.5;
            for (let i = 0; i < bufferLength; i++) {
                const value = dataArray[i] / 255;
                const barHeight = value * h * 0.8;
                const hue = (i / bufferLength) * 360 + Date.now() / 50;
                ctx.fillStyle = `hsl(${hue % 360}, 100%, 60%)`;
                const x = i * (barWidth + 1);
                const y = h - barHeight;
                ctx.shadowColor = `hsla(${hue % 360}, 100%, 60%, 0.3)`;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, barHeight, 3);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 2. WELLEN
        // ============================================================
        function drawWaves(dataArray, ctx, w, h) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#0a0a2e');
            grad.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            const step = Math.floor(dataArray.length / 200);
            const points = [];
            for (let i = 0; i < 200; i++) {
                const idx = i * step;
                const val = dataArray[idx] || 0;
                points.push({ x: (i/200)*w, y: h/2 + (val/255-0.5)*h*0.8 });
            }

            const colors = ['#ff6b6b', '#fcc419', '#51cf66', '#74c0fc', '#cc5de8'];
            for (let wave = 0; wave < 3; wave++) {
                ctx.beginPath();
                const offset = wave * 0.3;
                ctx.strokeStyle = colors[wave % colors.length];
                ctx.lineWidth = 3 - wave * 0.8;
                ctx.shadowColor = colors[wave % colors.length] + '80';
                ctx.shadowBlur = 15;
                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    const yOffset = Math.sin(i * 0.05 + Date.now()/2000 + offset) * 20;
                    if (i === 0) ctx.moveTo(p.x, p.y + yOffset * (1 - wave*0.2));
                    else ctx.lineTo(p.x, p.y + yOffset * (1 - wave*0.2));
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 3. KREIS-SPEKTRUM
        // ============================================================
        function drawCircle(dataArray, ctx, w, h) {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            const cx = w/2, cy = h/2;
            const radius = Math.min(w, h) * 0.35;
            const bufferLength = dataArray.length;
            const angleStep = (Math.PI * 2) / bufferLength;

            for (let i = 0; i < bufferLength; i++) {
                const value = dataArray[i] / 255;
                const barHeight = value * radius * 0.6;
                const angle = i * angleStep + Date.now()/4000;
                const x1 = cx + Math.cos(angle) * radius;
                const y1 = cy + Math.sin(angle) * radius;
                const x2 = cx + Math.cos(angle) * (radius + barHeight);
                const y2 = cy + Math.sin(angle) * (radius + barHeight);
                const hue = (i / bufferLength) * 360 + Date.now()/100;
                ctx.strokeStyle = `hsl(${hue % 360}, 100%, 60%)`;
                ctx.lineWidth = 2 + value * 4;
                ctx.shadowColor = `hsla(${hue % 360}, 100%, 60%, 0.4)`;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 4. FEUERWERK
        // ============================================================
        function drawFireworks(dataArray, ctx, w, h) {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, w, h);

            const numParticles = 60;
            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;

            for (let i = 0; i < numParticles; i++) {
                const angle = (i/numParticles)*Math.PI*2 + Date.now()/3000;
                const dist = 100 + intensity*200 + Math.sin(Date.now()/2000 + i)*50;
                const x = w/2 + Math.cos(angle + Date.now()/5000) * dist;
                const y = h/2 + Math.sin(angle*2 + Date.now()/4000) * dist * 0.6;
                const size = 2 + intensity * 6;
                const hue = (i/numParticles)*360 + Date.now()/100;
                ctx.fillStyle = `hsla(${hue % 360}, 100%, 70%, ${0.6 + intensity*0.4})`;
                ctx.shadowColor = `hsla(${hue % 360}, 100%, 70%, 0.5)`;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 5. LISSAJOUS
        // ============================================================
        function drawLissajous(dataArray, ctx, w, h) {
            ctx.fillStyle = 'rgba(10, 10, 20, 0.1)';
            ctx.fillRect(0, 0, w, h);

            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;
            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.4;
            const t = Date.now() / 2000;

            ctx.beginPath();
            for (let i = 0; i <= 200; i++) {
                const progress = i/200;
                const angle = progress * Math.PI * 2;
                const x = cx + Math.sin(angle * (3 + intensity*2) + t) * maxR * 0.9;
                const y = cy + Math.cos(angle * (2 + intensity*3) + t*0.7) * maxR * 0.7;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            const hue = (t * 30) % 360;
            ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
            ctx.lineWidth = 2 + intensity * 3;
            ctx.shadowColor = `hsl(${hue}, 100%, 60%, 0.5)`;
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // ============================================================
        // 6. WIRBEL
        // ============================================================
        function drawWirbel(dataArray, ctx, w, h) {
            const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/1.5);
            grad.addColorStop(0, '#0a0a2e');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.45;
            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;
            const numArms = 4 + Math.floor(intensity * 4);
            const time = Date.now() / 3000;

            for (let arm = 0; arm < numArms; arm++) {
                const angleOffset = (arm/numArms) * Math.PI * 2;
                ctx.beginPath();
                for (let r = 0; r < maxR; r += 2) {
                    const angle = r * 0.02 + time + angleOffset + intensity * 0.5;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    if (r === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                const hue = (arm/numArms)*360 + time*50;
                ctx.strokeStyle = `hsl(${hue % 360}, 100%, 60%)`;
                ctx.lineWidth = 2 + intensity * 3;
                ctx.shadowColor = `hsla(${hue % 360}, 100%, 60%, 0.3)`;
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 7. NEBEL 🌌 (NEU)
        // ============================================================
        function drawNebel(dataArray, ctx, w, h) {
            // Farbiger Nebel, der zur Musik pulsiert
            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            const time = Date.now() / 3000;
            const numLayers = 8;

            for (let layer = 0; layer < numLayers; layer++) {
                const hue = (layer / numLayers) * 360 + time * 20;
                const radius = 100 + layer * 60 + intensity * 80 + Math.sin(time + layer) * 40;
                const cx = w/2 + Math.sin(time * 0.5 + layer * 0.8) * 80;
                const cy = h/2 + Math.cos(time * 0.7 + layer * 1.1) * 60;

                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, `hsla(${hue % 360}, 100%, 70%, ${0.3 + intensity * 0.2})`);
                grad.addColorStop(0.5, `hsla(${hue % 360 + 40}, 80%, 50%, ${0.2 + intensity * 0.15})`);
                grad.addColorStop(1, `hsla(${hue % 360 + 80}, 60%, 30%, 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Glow-Zentrum
            const glow = 30 + intensity * 80;
            const grad2 = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, glow);
            grad2.addColorStop(0, `rgba(255,255,255,${0.1 + intensity * 0.3})`);
            grad2.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.arc(w/2, h/2, glow, 0, Math.PI*2);
            ctx.fill();
        }

        // ============================================================
        // 8. PARTIKEL ✨ (NEU)
        // ============================================================
        function drawParticle(dataArray, ctx, w, h) {
            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;

            // Hintergrund mit leichtem Nachleuchten
            ctx.fillStyle = 'rgba(5, 5, 10, 0.15)';
            ctx.fillRect(0, 0, w, h);

            const numParticles = 200 + intensity * 300;
            const time = Date.now() / 2000;

            for (let i = 0; i < numParticles; i++) {
                const seed = i * 137.508;
                const angle = seed + time * (0.5 + intensity * 0.5);
                const dist = 50 + (i / numParticles) * Math.min(w, h) * 0.5 + Math.sin(time + i) * 30 * intensity;
                const x = w/2 + Math.cos(angle + Math.sin(time + i * 0.1)) * dist;
                const y = h/2 + Math.sin(angle * 1.3 + Math.cos(time * 0.7 + i * 0.05)) * dist * 0.6;

                const size = 1 + intensity * 4 + Math.sin(time * 2 + i) * 1;
                const hue = (i / numParticles) * 360 + time * 50;
                const alpha = 0.3 + intensity * 0.7 + Math.sin(time + i) * 0.2;

                ctx.fillStyle = `hsla(${hue % 360}, 100%, 70%, ${Math.min(1, alpha)})`;
                ctx.shadowColor = `hsla(${hue % 360}, 100%, 70%, 0.2)`;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 9. 3D-TORUS 🌀 (NEU)
        // ============================================================
        function drawTorus(dataArray, ctx, w, h) {
            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.35;
            const time = Date.now() / 2000;

            const numPoints = 80;
            const segments = 60;

            for (let i = 0; i < numPoints; i++) {
                for (let j = 0; j < segments; j++) {
                    const u = (i / numPoints) * Math.PI * 2;
                    const v = (j / segments) * Math.PI * 2;

                    const r = maxR * (1 + intensity * 0.3 + Math.sin(v * 2 + time) * 0.15);
                    const x = cx + Math.cos(u + time * 0.5) * (r + Math.sin(v + time) * 20 * intensity);
                    const y = cy + Math.sin(u + time * 0.5) * (r + Math.cos(v + time) * 20 * intensity);

                    const size = 2 + intensity * 4;
                    const hue = (i / numPoints) * 360 + time * 40 + j * 5;
                    const alpha = 0.5 + intensity * 0.5;

                    ctx.fillStyle = `hsla(${hue % 360}, 100%, 60%, ${alpha})`;
                    ctx.shadowColor = `hsla(${hue % 360}, 100%, 60%, 0.3)`;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // ============================================================
        // 10. BLITZE ⚡ (NEU)
        // ============================================================
        function drawBlitze(dataArray, ctx, w, h) {
            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;

            // Hintergrund mit leichtem Glow
            const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/1.2);
            grad.addColorStop(0, `rgba(20, 0, 40, ${0.5 + intensity * 0.3})`);
            grad.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            const numBolts = 3 + Math.floor(intensity * 8);
            const time = Date.now() / 1000;

            for (let bolt = 0; bolt < numBolts; bolt++) {
                const startX = (bolt / numBolts) * w * 0.1 + Math.random() * w * 0.8;
                const startY = 0;
                const endX = w/2 + Math.sin(bolt * 2 + time) * w * 0.3;
                const endY = h;

                ctx.beginPath();
                ctx.moveTo(startX, startY);

                let x = startX, y = startY;
                const steps = 30 + Math.floor(intensity * 20);

                for (let i = 0; i <= steps; i++) {
                    const progress = i / steps;
                    const targetX = startX + (endX - startX) * progress;
                    const targetY = startY + (endY - startY) * progress;

                    const offset = (1 - progress) * 30 * intensity * (1 + Math.random() * 0.5);
                    x = targetX + Math.sin(progress * 20 + time * 2 + bolt * 5) * offset;
                    y = targetY + Math.cos(progress * 15 + time * 1.5 + bolt * 3) * offset * 0.3;

                    ctx.lineTo(x, y);
                }

                const hue = (bolt / numBolts) * 360 + time * 50;
                ctx.strokeStyle = `hsla(${hue % 360}, 100%, 70%, ${0.3 + intensity * 0.5})`;
                ctx.lineWidth = 1 + intensity * 4;
                ctx.shadowColor = `hsla(${hue % 360}, 100%, 70%, 0.5)`;
                ctx.shadowBlur = 30;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 11. REGENBOGEN-RING 🌈 (NEU)
        // ============================================================
        function drawRegenbogen(dataArray, ctx, w, h) {
            const avg = dataArray.reduce((a,b) => a+b, 0) / dataArray.length;
            const intensity = avg / 255;

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.4;
            const time = Date.now() / 3000;

            const numRings = 12 + Math.floor(intensity * 8);

            for (let ring = 0; ring < numRings; ring++) {
                const progress = ring / numRings;
                const radius = maxR * (0.2 + progress * 0.8) + Math.sin(time + ring) * 10 * intensity;
                const lineWidth = 2 + intensity * 5 + Math.sin(time * 2 + ring) * 1;
                const hue = (ring / numRings) * 360 + time * 40;

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${hue % 360}, 100%, 60%, ${0.3 + intensity * 0.5 + Math.sin(time + ring) * 0.2})`;
                ctx.lineWidth = lineWidth;
                ctx.shadowColor = `hsla(${hue % 360}, 100%, 60%, 0.3)`;
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Zusätzliche kleine Ringe (Pulsation)
                if (ring % 2 === 0) {
                    const subRadius = radius + Math.sin(time * 2 + ring * 0.5) * 15 * intensity;
                    ctx.beginPath();
                    ctx.arc(cx, cy, subRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${hue % 360 + 60}, 100%, 70%, ${0.1 + intensity * 0.2})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            // Zentrum
            const glow = 20 + intensity * 60;
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glow);
            grad.addColorStop(0, `rgba(255,255,255,${0.1 + intensity * 0.3})`);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, glow, 0, Math.PI*2);
            ctx.fill();
        }

        // ============================================================
        // AUSWAHL
        // ============================================================
        function drawVisualizer(dataArray) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            switch (mode) {
                case 'balken': drawBars(dataArray, ctx, w, h); break;
                case 'wellen': drawWaves(dataArray, ctx, w, h); break;
                case 'kreis': drawCircle(dataArray, ctx, w, h); break;
                case 'feuerwerk': drawFireworks(dataArray, ctx, w, h); break;
                case 'lissajous': drawLissajous(dataArray, ctx, w, h); break;
                case 'wirbel': drawWirbel(dataArray, ctx, w, h); break;
                case 'nebel': drawNebel(dataArray, ctx, w, h); break;
                case 'partikel': drawParticle(dataArray, ctx, w, h); break;
                case 'torus': drawTorus(dataArray, ctx, w, h); break;
                case 'blitze': drawBlitze(dataArray, ctx, w, h); break;
                case 'regenbogen': drawRegenbogen(dataArray, ctx, w, h); break;
                default: drawBars(dataArray, ctx, w, h);
            }
        }

        // ----- roundRect Polyfill -----
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ----- Datei auswählen -----
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const displayName = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
            songName.textContent = displayName;
            addLog(`📂 ${file.name} (${(file.size/1024).toFixed(0)} KB)`, 'info');

            if (!audioContext) {
                audioContext = new(window.AudioContext || window.webkitAudioContext)();
                addLog(`✅ AudioContext`, 'success');
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            try {
                if (currentSourceNode) { currentSourceNode.disconnect();
                    currentSourceNode = null; }
                if (currentAudioElement) {
                    currentAudioElement.pause();
                    currentAudioElement.src = '';
                    currentAudioElement = null;
                }

                const audioElement = new Audio();
                const objectUrl = URL.createObjectURL(file);
                audioElement.src = objectUrl;
                audioElement.loop = false;
                audioElement.volume = volumeControl.value;

                const source = audioContext.createMediaElementSource(audioElement);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                source.connect(analyser);
                analyser.connect(audioContext.destination);

                currentSourceNode = source;
                currentAnalyser = analyser;
                currentAudioElement = audioElement;

                resizeCanvas();

                audioElement.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                    addLog('✅ Wiedergabe 🎵', 'success');
                    if (animationId) cancelAnimationFrame(animationId);
                    renderVisualizer();
                }).catch(err => {
                    addLog(`⚠️ Autoplay: ${err.message}`, 'warn');
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                });

                fileInput.value = '';

            } catch (error) {
                addLog(`❌ ${error.message}`, 'error');
                songName.textContent = '❌ Fehler';
            }
        }

        // ----- Rendering -----
        function renderVisualizer() {
            if (!currentAnalyser) return;
            const dataArray = new Uint8Array(currentAnalyser.frequencyBinCount);
            currentAnalyser.getByteFrequencyData(dataArray);
            drawVisualizer(dataArray);
            animationId = requestAnimationFrame(renderVisualizer);
        }

        // ----- Modus wechseln -----
        function switchMode() {
            currentModeIndex = (currentModeIndex + 1) % MODES.length;
            mode = MODES[currentModeIndex];
            modeLabel.textContent = MODE_NAMES[mode];
            addLog(`🔄 ${MODE_NAMES[mode]}`, 'info');
        }

        // ----- Event-Listener -----
        fileInput.addEventListener('change', handleFileSelect);

        playBtn.addEventListener('click', function() {
            if (!currentAudioElement) { fileInput.click(); return; }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                currentAudioElement.pause();
                playBtn.textContent = '▶️';
                isPlaying = false;
                addLog('⏸️ Pause', 'info');
            } else {
                currentAudioElement.play().then(() => {
                    playBtn.textContent = '⏸️';
                    isPlaying = true;
                    addLog('▶️ Play', 'success');
                }).catch(err => {
                    addLog(`❌ Play: ${err.message}`, 'error');
                });
            }
        });

        modeBtn.addEventListener('click', switchMode);

        volumeControl.addEventListener('input', function() {
            if (currentAudioElement) currentAudioElement.volume = volumeControl.value;
        });

        window.addEventListener('resize', resizeCanvas);

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault();
                playBtn.click(); }
            if (e.key === 'm' || e.key === 'M') { switchMode(); }
        });

        // ----- Start -----
        audioContext = new(window.AudioContext || window.webkitAudioContext)();
        addLog(`✅ AudioContext`, 'success');
        resizeCanvas();
        addLog('💡 MP3 laden', 'info');
        addLog('🔄 Taste "m" = Modus', 'info');
        modeLabel.textContent = MODE_NAMES[mode];
    </script>
</body>
</html>
